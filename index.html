<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>天衣 · 无缝的江湖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cloth:#141821; --cloth2:#1b212c; --cloth3:#222a37;
  --weft:#2f3a4c; --weft2:#3d4a60;
  --silk:#ded8c9; --silk2:#a49e90; --silk3:#736f66;
  --thread:#c9a227; --thread2:#e8c65a;
  --cinnabar:#a8443c; --jade:#5f9078; --violet:#7b6b9b;
  --r:2px;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --kai:"STKaiti","Kaiti SC","KaiTi","Noto Serif SC",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--cloth); color:var(--silk); font-family:var(--serif);
  font-size:15px; line-height:1.85; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
/* woven ground */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background:
   repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px),
   repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),
   radial-gradient(120% 80% at 50% 0%,rgba(120,140,180,.07),transparent 70%);}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font-family:inherit;font-size:inherit}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:var(--weft);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ── seam: the running-stitch rule used as every divider ── */
.seam{height:1px;margin:14px 0;background:repeating-linear-gradient(90deg,var(--weft2) 0 7px,transparent 7px 13px)}
.seam.gold{background:repeating-linear-gradient(90deg,rgba(201,162,39,.55) 0 7px,transparent 7px 13px)}

#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}

/* ── top bar ── */
.bar{display:flex;align-items:baseline;gap:14px;padding:9px 18px;border-bottom:1px solid var(--weft);
  background:linear-gradient(180deg,#1a202b,#141821);flex:0 0 auto}
.bar h1{font-family:var(--kai);font-size:19px;font-weight:600;margin:0;letter-spacing:.22em;color:var(--silk)}
.bar h1 em{font-style:normal;color:var(--thread)}
.bar .sub{color:var(--silk3);font-size:12.5px;letter-spacing:.1em}
.bar .right{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:12.5px;color:var(--silk3)}
.bar .right b{color:var(--thread);font-weight:400}

.grid{flex:1 1 auto;display:grid;grid-template-columns:262px minmax(0,1fr);min-height:0}
.col{min-height:0;overflow-y:auto;padding:16px 18px}
#char{border-right:1px solid var(--weft);background:#171c26}


/* ── character panel ── */
.pname{font-family:var(--kai);font-size:22px;letter-spacing:.12em;margin:0 0 2px}
.ptitle{color:var(--thread);font-size:12.5px;letter-spacing:.14em;margin-bottom:2px}
.psect{color:var(--silk3);font-size:12.5px}
.gauge{margin:9px 0}
.gauge .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--silk3);margin-bottom:3px}
.gauge .lab b{color:var(--silk2);font-weight:400}
.track{height:5px;background:#0e1219;border:1px solid #222a36;overflow:hidden}
.fill{height:100%;transition:width .4s ease}
.fill.qi{background:linear-gradient(90deg,#8a6f1a,var(--thread2))}
.fill.exp{background:linear-gradient(90deg,#3d5f52,var(--jade))}
.fill.hp{background:linear-gradient(90deg,#6d2f2a,#c9564b)}
.attrs{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:13.5px}
.attrs div{display:flex;justify-content:space-between;border-bottom:1px dotted #283040;padding:2px 0}
.attrs span{color:var(--silk3)}
.attrs b{font-weight:400;color:var(--silk)}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:1.5px 0;color:var(--silk2)}
.kv b{font-weight:400;color:var(--silk)}
.hd{font-family:var(--kai);font-size:13.5px;color:var(--thread);letter-spacing:.2em;margin:0 0 8px}

/* ── tabs ── */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--weft);margin:-16px -18px 16px;padding:0 18px;
  position:sticky;top:-16px;background:#141821;z-index:5;flex-wrap:wrap}
.tab{padding:10px 15px;font-family:var(--kai);font-size:15px;letter-spacing:.16em;color:var(--silk3);
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--silk2)}
.tab.on{color:var(--thread2);border-bottom-color:var(--thread)}
.tab .dot{display:inline-block;width:5px;height:5px;background:var(--cinnabar);border-radius:50%;
  vertical-align:top;margin-left:3px}

/* ── cards ── */
.card{border:1px solid var(--weft);background:var(--cloth2);padding:13px 15px;margin-bottom:11px}
.card.sel{border-color:var(--thread);background:#232a1f}
.card .t{font-family:var(--kai);font-size:16px;letter-spacing:.1em}
.card .d{color:var(--silk2);font-size:13px;margin-top:4px}
.card .m{color:var(--silk3);font-size:12px;margin-top:5px}
.row{display:flex;gap:12px;align-items:flex-start}
.row .g{flex:1 1 auto;min-width:0}
.tag{display:inline-block;border:1px solid var(--weft2);color:var(--silk3);font-size:11.5px;
  padding:0 6px;margin-right:5px;letter-spacing:.08em}
.tag.gold{border-color:#6b5716;color:var(--thread)}
.tag.jade{border-color:#33503f;color:var(--jade)}
.tag.red{border-color:#5a2c28;color:#c4675c}
.btn{border:1px solid var(--weft2);padding:5px 13px;color:var(--silk2);letter-spacing:.1em;font-size:13.5px;
  transition:background .15s,color .15s,border-color .15s;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--thread);color:var(--thread2);background:#20242038}
.btn:disabled{opacity:.32;cursor:not-allowed}
.btn.pri{border-color:#6b5716;color:var(--thread2);background:#231f14}
.btn.pri:hover{background:#2e2716}
.btn.sm{padding:2px 9px;font-size:12.5px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:11px}
.muted{color:var(--silk3)}
.empty{color:var(--silk3);text-align:center;padding:34px 10px;font-family:var(--kai);letter-spacing:.16em}

/* ── log ── */
.logline{font-size:13.2px;line-height:1.7;padding:4px 0;border-bottom:1px dotted #232b39;color:var(--silk2)}
.logline i{font-style:normal;color:var(--silk3);font-size:11.5px;margin-right:6px}
.logline.g{color:var(--jade)} .logline.r{color:#c4675c} .logline.y{color:var(--thread)}
.logline.v{color:#9c8bc0}

/* ── overlays ── */
.veil{position:fixed;inset:0;z-index:60;background:rgba(8,10,14,.93);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;overflow-y:auto}
.sheet{width:100%;max-width:620px;border:1px solid var(--weft2);background:var(--cloth2);padding:26px 30px;
  box-shadow:0 22px 70px rgba(0,0,0,.6);max-height:88vh;overflow-y:auto}
.sheet h2{font-family:var(--kai);font-size:21px;letter-spacing:.24em;margin:0 0 4px;font-weight:600}
.sheet .who{color:var(--thread);font-family:var(--kai);letter-spacing:.14em;font-size:14px;margin-bottom:10px}
.story p{margin:0 0 13px;text-indent:2em;max-width:36em}
.story p.no{text-indent:0}
.story p.say{text-indent:0;padding-left:1.1em;border-left:2px solid var(--weft2);color:#e6e0d0}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--weft);padding:9px 14px;margin-bottom:8px;
  color:var(--silk2);transition:.15s}
.opt:hover:not(:disabled){border-color:var(--thread);color:var(--thread2);background:#1f2430}
.opt:disabled{opacity:.35;cursor:not-allowed}
.opt small{display:block;color:var(--silk3);font-size:12px;margin-top:2px}

/* ── battle ── */
.vs{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.vs .side{flex:1 1 0;min-width:0}
.vs .nm{font-family:var(--kai);letter-spacing:.1em;font-size:15px;display:flex;justify-content:space-between}
.vs .mid{font-family:var(--kai);color:var(--cinnabar);font-size:17px;letter-spacing:.2em}
#blog{height:300px;overflow-y:auto;border:1px solid var(--weft);background:#11151d;padding:11px 14px;font-size:13.5px}
#blog div{padding:2.5px 0;animation:fin .25s ease}
@keyframes fin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.bl-h{color:#c4675c} .bl-y{color:var(--thread2)} .bl-g{color:var(--jade)} .bl-m{color:var(--silk3)}
.bl-r{color:var(--silk3);text-align:center;letter-spacing:.3em;font-family:var(--kai);padding-top:7px!important}

/* ── prologue ── */
#pro{position:fixed;inset:0;z-index:80;background:#0a0c11;display:flex;align-items:center;justify-content:center;
  padding:24px;overflow-y:auto}
#pro .inner{max-width:560px;width:100%}
#pro .ttl{font-family:var(--kai);font-size:min(15vw,74px);letter-spacing:.34em;text-indent:.34em;text-align:center;
  color:var(--silk);margin:0 0 4px;opacity:0;animation:tin 2s ease .3s forwards}
#pro .tsub{text-align:center;color:var(--thread);letter-spacing:.42em;text-indent:.42em;font-size:12.5px;
  opacity:0;animation:tin 2s ease 1.1s forwards;margin-bottom:26px}
@keyframes tin{to{opacity:1}}
#pro .line{display:block;margin:0 auto 26px;width:190px}
#pro .line path{stroke:var(--thread);stroke-width:1;fill:none;stroke-dasharray:4 6;
  stroke-dashoffset:400;animation:draw 3.4s ease .6s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#pro .txt p{opacity:0;animation:tin 1.5s ease forwards;margin:0 0 12px;color:var(--silk2);text-indent:2em}
#pro .txt p.no{text-indent:0}
#pro .go{display:block;margin:22px auto 0;opacity:0;animation:tin 1.4s ease forwards}
@media (prefers-reduced-motion:reduce){#pro *{animation-duration:.01s!important}}

/* ── forms ── */
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12.5px;color:var(--silk3);letter-spacing:.14em;margin-bottom:5px}
.fld input,.fld textarea{width:100%;background:#10141b;border:1px solid var(--weft);color:var(--silk);
  padding:8px 11px;letter-spacing:.1em}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--thread)}
.pick{border:1px solid var(--weft);padding:10px 13px;margin-bottom:8px;width:100%;text-align:left;transition:.15s}
.pick:hover{border-color:var(--weft2);background:#1f2430}
.pick.on{border-color:var(--thread);background:#232a1f}
.pick b{font-family:var(--kai);font-size:15.5px;letter-spacing:.12em;font-weight:400;color:var(--silk)}
.pick p{margin:3px 0 0;font-size:12.8px;color:var(--silk3)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:34px;z-index:90;display:flex;
  flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#232a37;border:1px solid var(--weft2);padding:6px 16px;font-size:13.5px;
  animation:tup .3s ease}
@keyframes tup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.mob{display:none}
@media (max-width:1080px){
  .grid{grid-template-columns:230px minmax(0,1fr)}
}
@media (max-width:780px){
  body{font-size:14.5px}
  .grid{grid-template-columns:1fr}
  #char{display:none;border-right:none}
  #char.show{display:block}
  .col{padding:14px}
  .tabs{margin:-14px -14px 14px;padding:0 8px;top:-14px}
  .tab{padding:9px 11px;font-size:14px;letter-spacing:.1em}
  .bar{padding:8px 14px}
  .bar .sub{display:none}
  .mob{display:inline-block}
  .sheet{padding:20px 18px}
}
:focus-visible{outline:2px solid var(--thread);outline-offset:2px}

/* 罗盘与舆图 */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:290px;margin:2px auto 0}
.pad .c{display:flex;align-items:center;justify-content:center;min-height:46px}
.pad button{width:100%;min-height:46px;border:1px solid var(--weft);background:var(--cloth2);
 color:var(--silk);border-radius:3px;font-family:inherit;font-size:13px;line-height:1.3;cursor:pointer;padding:4px 2px}
.pad button:hover{border-color:var(--thread);color:var(--thread)}
.pad button b{display:block;font-size:11px;color:var(--thread);letter-spacing:.1em}
.pad .here2{border:1px dashed var(--weft);border-radius:3px;color:var(--silk);
 display:flex;align-items:center;justify-content:center;font-size:13px;text-align:center;opacity:.85}
.pad .non{opacity:.22;border:1px dashed var(--weft);border-radius:3px}
.mapg{display:grid;gap:5px;margin-top:8px;overflow-x:auto;padding-bottom:2px}
.mapg .cell{min-height:40px;border-radius:3px;display:flex;align-items:center;justify-content:center;
 font-size:12px;text-align:center;padding:3px;border:1px solid transparent}
.mapg .on{border-color:var(--weft);background:var(--cloth2);color:var(--silk);cursor:pointer}
.mapg .on:hover{border-color:var(--thread);color:var(--thread)}
.mapg .cur{border-color:var(--thread);color:var(--thread);background:rgba(201,162,39,.09)}
.mapg .off{color:var(--weft)}
.mapg .cur::after{content:"　◈";font-size:10px}

/* 此地——正文 */
#place{padding-bottom:2px}
.locn{font-family:var(--kai);font-size:25px;color:var(--thread);letter-spacing:.06em;margin:2px 0 5px}
.locd{color:var(--silk);opacity:.8;line-height:1.85;margin-bottom:10px}
.here{display:flex;flex-wrap:wrap;gap:7px;margin:7px 0}
.chip{border:1px solid var(--weft);border-radius:2px;padding:5px 11px;background:var(--cloth2);
 font-size:13px;color:var(--silk);cursor:pointer;font-family:inherit}
.chip:hover{border-color:var(--thread);color:var(--thread)}
.chip[disabled]{opacity:.35;cursor:default}
.chip b{color:var(--thread);font-weight:400}
.chip.on{border-color:var(--thread);color:var(--thread);background:rgba(201,162,39,.08)}
.lbl{font-size:12px;letter-spacing:.22em;color:var(--weft);margin:13px 0 4px}
#logwrap{margin-top:6px}
#log{max-height:none}
#drawer{position:sticky;bottom:0;background:linear-gradient(transparent,var(--cloth) 26%);
 padding:14px 0 4px;margin-top:14px;display:flex;flex-wrap:wrap;gap:7px}
.sheet .hd:first-child{margin-top:0}

/* 见闻／战斗占上半，舆图占下半 */
#main{display:flex;flex-direction:column}
#stage{flex:1 1 auto;min-height:210px;overflow-y:auto;padding-right:4px}
#world{flex:0 0 auto;padding:4px 0 2px}
.wgrid{display:grid;grid-template-columns:1fr minmax(210px,1.5fr) 1fr;gap:9px;align-items:center}
.node{border:1px solid var(--weft);border-radius:5px;padding:9px 10px;background:var(--cloth2);
 cursor:pointer;text-align:center;transition:border-color .15s,color .15s}
.node:hover{border-color:var(--thread);color:var(--thread)}
.node .ar{font-size:11.5px;letter-spacing:.2em;color:var(--thread);opacity:.75}
.node .nm{font-family:var(--kai);font-size:17px;margin-top:2px}
.node .st{font-size:11px;opacity:.45;margin-top:2px}
.node.dim{opacity:.3;cursor:default;border-style:dashed}
.node.dim:hover{border-color:var(--weft);color:var(--silk)}
.hub{border:1px solid var(--thread);border-radius:5px;padding:12px 13px;
 background:rgba(201,162,39,.055);text-align:left}
.hub .nm{font-family:var(--kai);font-size:22px;color:var(--thread);letter-spacing:.05em}
.hub .dd{font-size:12.5px;opacity:.72;line-height:1.7;margin:4px 0 8px}
.wrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tagl{font-size:11px;letter-spacing:.18em;color:var(--weft);margin-top:9px}
#battle .vs{margin-bottom:8px}

/* ══════ 此地 ══════ */
.lochd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.locn{font-family:var(--kai);font-size:24px;color:var(--thread);letter-spacing:.06em;margin:0}
.loct{font-size:12px;letter-spacing:.14em;color:var(--silk3)}
.locd{color:var(--silk);opacity:.78;line-height:1.8;margin:5px 0 2px;font-size:13.5px}
.chip i{font-style:normal;font-size:11px;color:var(--silk3);letter-spacing:.02em}
.chip u{text-decoration:none;font-size:11px;color:var(--jade)}
.chip.gho{border-style:dashed;color:var(--silk3)}
.chip.gho:hover{color:var(--thread);border-color:var(--thread)}
.rowq{display:flex;gap:10px;font-size:12.5px;padding:3px 0;color:var(--silk3);border-bottom:1px dotted #232b39}
.rowq span{flex:0 0 3.2em;letter-spacing:.14em}
.rowq b{font-weight:400;color:var(--silk2)}
.rowq.ok b{color:var(--jade)}
.rowq:not(.ok) b{color:var(--thread)}
.card .btns small{color:var(--silk3);font-size:11.5px}

/* ══════ 舆图：一块布，路是针脚 ══════ */
#world{flex:0 0 auto;padding:2px 0;border-top:1px solid var(--weft);margin-top:10px}
.cmap{display:block;width:100%;height:clamp(196px,31vh,330px)}
.mapbox{border:1px solid var(--weft);background:#11151d;padding:6px 4px;margin-top:8px}
.cmap.big{height:auto;aspect-ratio:214/126;max-height:56vh}
.cmap .river{fill:none;stroke:#2b3b4c;stroke-width:2.4;stroke-linecap:round;opacity:.7}
.cmap .river.dry{stroke:#2b3038;stroke-width:1.6;stroke-dasharray:3 4;opacity:.55}
.cmap .rg{fill:var(--weft2);font-size:5.6px;letter-spacing:.3em;opacity:.3;
  font-family:var(--kai);text-anchor:middle;pointer-events:none}
.cmap .rd{stroke:var(--weft2);stroke-width:.85;stroke-dasharray:3 2.4;opacity:.9}
.cmap .rd.un{stroke:var(--weft);stroke-width:.7;stroke-dasharray:.9 3;opacity:.55}
.cmap .clueln{stroke:var(--cinnabar);stroke-width:.75;stroke-dasharray:2 3.4;opacity:.8;
  animation:crawl 7s linear infinite;pointer-events:none}
@keyframes crawl{to{stroke-dashoffset:-54}}
.cmap .walkln{stroke:var(--thread);stroke-width:.8;stroke-dasharray:1.4 2;opacity:.55;pointer-events:none}
.cmap .trav{fill:var(--thread2);pointer-events:none}
.cmap .mn{cursor:pointer}
.cmap .hit{fill:transparent}
.cmap .knot{fill:var(--silk2);stroke:var(--cloth);stroke-width:.5;transition:fill .2s}
.cmap .nm{fill:var(--silk2);font-size:5.2px;text-anchor:middle;font-family:var(--kai);
  letter-spacing:.05em;pointer-events:none}
.cmap .mk{fill:var(--thread);font-size:3.6px;pointer-events:none}
.cmap .ring{fill:none;stroke:var(--thread);stroke-width:.7;opacity:.85}
.cmap .mn.on:hover .knot,.cmap .mn.cur .knot{fill:var(--thread2)}
.cmap .mn.on:hover .nm,.cmap .mn.cur .nm{fill:var(--thread2)}
.cmap .mn.ghost .knot,.cmap .mn.heard .knot{fill:none;stroke:var(--weft2);stroke-width:.6;stroke-dasharray:1 1}
.cmap .mn.ghost .nm,.cmap .mn.heard .nm{fill:var(--weft2);font-size:4.8px}
.cmap .mn.ghost:hover .knot,.cmap .mn.heard:hover .knot{stroke:var(--thread)}
.cmap .mn.tgt .knot{fill:var(--cinnabar);stroke:var(--cinnabar)}
.cmap .mn.tgt .nm{fill:#c4675c}
body[data-tod="night"] .cmap .nm,body[data-tod="deep"] .cmap .nm{opacity:.82}
body[data-tod="night"] .cmap .river,body[data-tod="deep"] .cmap .river{opacity:.5}
body[data-tod="dusk"] .cmap .rg{fill:#5a4a44}
@media (max-width:780px){
  .cmap{height:clamp(168px,26vh,240px)}
  .locn{font-size:21px}
}
</style>
</head>
<body>
<div id="pro"></div>
<div id="app" style="display:none">
  <div class="bar">
    <h1>天<em>衣</em></h1>
    <span class="sub">无缝的江湖</span>
    <button class="btn sm mob" id="mchar" style="margin-left:8px">人物</button>
    <div class="right">
      <span id="clock"></span>
      <span id="silver"></span>
    </div>
  </div>
  <div class="grid">
    <aside class="col" id="char"></aside>
    <main class="col" id="main">
      <div id="stage">
        <div id="battle" style="display:none"></div>
        <div id="here"></div>
        <div class="seam"></div>

<script>
/* ═══════════ 声 ═══════════
   全部现算：没有一个音频文件。
   拨弦用 Karplus-Strong，混响用现生成的脉冲响应，
   曲子是五声音阶上的即兴，不循环，所以听不出接缝。      */
const AU={ctx:null,mst:null,bgmG:null,sfxG:null,rev:null,
 on:true,vb:0.5,vs:0.65,mode:null,timers:[],drone:[],buf:{},ready:false};

function auInit(){
 if(AU.ctx||AU.dead)return AU.ctx;
 try{
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C){AU.dead=1;return null;}
  const x=new C();AU.ctx=x;
  AU.mst=x.createGain();AU.mst.gain.value=AU.on?1:0;AU.mst.connect(x.destination);
  // 混响：拿噪声按指数衰减生成一条脉冲响应，当作屋子的空气
  const sec=2.6,N=Math.floor(x.sampleRate*sec),ir=x.createBuffer(2,N,x.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);
   for(let i=0;i<N;i++){const t=i/N;d[i]=(Math.random()*2-1)*Math.pow(1-t,2.6)*(1-t*0.3);}}
  AU.rev=x.createConvolver();AU.rev.buffer=ir;
  const wet=x.createGain();wet.gain.value=0.34;AU.rev.connect(wet);wet.connect(AU.mst);
  AU.bgmG=x.createGain();AU.bgmG.gain.value=AU.vb;AU.bgmG.connect(AU.mst);AU.bgmG.connect(AU.rev);
  AU.sfxG=x.createGain();AU.sfxG.gain.value=AU.vs;AU.sfxG.connect(AU.mst);AU.sfxG.connect(AU.rev);
  AU.ready=true;return x;
 }catch(e){AU.dead=1;return null;}
}
function auResume(){const x=auInit();if(x&&x.state==="suspended")x.resume();return x;}

/* ── 五声音阶：宫 商 角 徵 羽 ── */
const PENT=[0,2,4,7,9];
function pitch(i){ // i=0 起于 D2
 const o=Math.floor(i/5),d=PENT[((i%5)+5)%5];
 return 73.42*Math.pow(2,(d+12*o)/12);
}

/* ── 拨弦：Karplus-Strong，缓存波形 ── */
function pluckBuf(f,dur,bright){
 const x=AU.ctx,key=Math.round(f)+"|"+dur+"|"+(bright||0);
 if(AU.buf[key])return AU.buf[key];
 const N=Math.ceil(x.sampleRate*dur),b=x.createBuffer(1,N,x.sampleRate),d=b.getChannelData(0);
 // 整数长度的延迟线会让高音跑调，差的那点零头用线性插值补回来。
 // 总延迟 = p + frac + 0.5（平均滤波器自带半个采样）
 const ideal=x.sampleRate/f-0.5, p=Math.max(2,Math.floor(ideal)), frac=ideal-p;
 const ring=new Float32Array(p+1);
 for(let i=0;i<=p;i++)ring[i]=Math.random()*2-1;
 for(let k=0;k<(bright?1:3);k++)for(let i=1;i<=p;i++)ring[i]=(ring[i]+ring[i-1])*0.5;
 let idx=0,last=0;const dec=0.9965+(bright?0.0022:0);
 for(let i=0;i<N;i++){
  const cur=ring[idx],nxt=ring[(idx+1)%(p+1)];
  const rd=cur+(nxt-cur)*frac;
  const v=(rd+last)*0.5*dec;
  ring[idx]=v;last=rd;d[i]=v;idx=(idx+1)%(p+1);
 }
 for(let i=0;i<N;i++)d[i]*=Math.min(1,i/220)*Math.pow(1-i/N,1.35); // 头尾都收干净
 AU.buf[key]=b;return b;
}
function note(f,t,gain,dur,dest,bright){
 const x=AU.ctx;if(!x)return;
 const s=x.createBufferSource();s.buffer=pluckBuf(f,dur||2.4,bright);
 const g=x.createGain();g.gain.value=gain;
 const lp=x.createBiquadFilter();lp.type="lowpass";lp.frequency.value=bright?5200:2600;
 s.connect(lp);lp.connect(g);g.connect(dest||AU.bgmG);
 s.start(t);s.stop(t+(dur||2.4));
}

/* ── 底下那层气：两个失谐的长音，慢慢起伏 ── */
function droneOn(root,vol){
 const x=AU.ctx;if(!x)return;droneOff();
 for(const det of [0,7]){
  const o=x.createOscillator();o.type="triangle";
  o.frequency.value=pitch(root)*(det?1.4983:1)/2;
  o.detune.value=(Math.random()*10-5);
  const g=x.createGain();g.gain.value=0;
  const lp=x.createBiquadFilter();lp.type="lowpass";lp.frequency.value=420;
  const lfo=x.createOscillator();lfo.type="sine";lfo.frequency.value=0.045+Math.random()*0.03;
  const la=x.createGain();la.gain.value=vol*0.5;
  lfo.connect(la);la.connect(g.gain);
  g.gain.setValueAtTime(0,x.currentTime);
  g.gain.linearRampToValueAtTime(vol*0.55,x.currentTime+6);
  o.connect(lp);lp.connect(g);g.connect(AU.bgmG);
  o.start();lfo.start();AU.drone.push(o,lfo,g);
 }
}
function droneOff(){
 const x=AU.ctx;if(!x)return;
 for(const n of AU.drone){try{ if(n.gain){n.gain.cancelScheduledValues(x.currentTime);
   n.gain.setValueAtTime(n.gain.value,x.currentTime);n.gain.linearRampToValueAtTime(0,x.currentTime+1.2);}
  else n.stop(x.currentTime+1.4);}catch(e){}}
 AU.drone=[];
}

/* ── 曲子：不写死谱，每次现挑 ── */
const MODES={
 road :{root:0,gap:[2.6,5.4],reg:[5,13],vol:.30,phr:[1,1,1,2,2,3],drone:.16},
 town :{root:0,gap:[2.0,4.2],reg:[6,14],vol:.32,phr:[1,2,2,3],      drone:.13},
 wild :{root:-1,gap:[3.4,7.0],reg:[3,11],vol:.27,phr:[1,1,2],       drone:.20},
 fight:{root:-2,gap:[0.9,1.9],reg:[2,10],vol:.34,phr:[2,3,3,4],     drone:.22,pulse:1},
 tale :{root:0,gap:[4.5,9.0],reg:[8,15],vol:.24,phr:[1,1,2],        drone:.15},
 end  :{root:-1,gap:[3.0,6.0],reg:[4,14],vol:.30,phr:[2,3,4],       drone:.18,fall:1},
};
function clearTimers(){AU.timers.forEach(t=>clearTimeout(t));AU.timers=[];}
function bgm(m){
 if(!AU.on)return;const x=auInit();if(!x)return;
 if(AU.mode===m)return;
 AU.mode=m;clearTimers();
 const M=MODES[m]||MODES.road;
 droneOn(M.root,M.drone);
 let last=Math.floor((M.reg[0]+M.reg[1])/2);
 const phrase=()=>{
  if(AU.mode!==m||!AU.on)return;
  const n=M.phr[Math.floor(Math.random()*M.phr.length)];
  let t=x.currentTime+0.05;
  for(let i=0;i<n;i++){
   // 走法：多是邻音，偶尔跳一下，像有人随手在拨
   let step=Math.random()<0.68?(Math.random()<0.5?1:-1)
           :(Math.random()<0.5?2:-2)*(Math.random()<0.3?2:1);
   if(M.fall)step=-Math.abs(step);
   last=Math.max(M.reg[0],Math.min(M.reg[1],last+step));
   const v=M.vol*(0.55+Math.random()*0.5)*(i?0.78:1);
   note(pitch(last),t,v,2.2+Math.random()*1.6,null,last>11);
   t+=0.28+Math.random()*0.5;
   if(Math.random()<0.22)t+=0.4;
  }
  if(M.pulse){ // 战里那一下闷响，像远处有人在敲什么
   const g=x.createGain(),o=x.createOscillator();
   o.type="sine";o.frequency.setValueAtTime(96,x.currentTime);
   o.frequency.exponentialRampToValueAtTime(42,x.currentTime+0.22);
   g.gain.setValueAtTime(0.16,x.currentTime);
   g.gain.exponentialRampToValueAtTime(0.001,x.currentTime+0.3);
   o.connect(g);g.connect(AU.bgmG);o.start();o.stop(x.currentTime+0.32);
  }
  const gap=M.gap[0]+Math.random()*(M.gap[1]-M.gap[0]);
  AU.timers.push(setTimeout(phrase,gap*1000));
 };
 AU.timers.push(setTimeout(phrase,220));
}
function bgmStop(){AU.mode=null;clearTimers();droneOff();}

/* ── 响动 ── */
function nz(dur){const x=AU.ctx,N=Math.ceil(x.sampleRate*dur),b=x.createBuffer(1,N,x.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<N;i++)d[i]=Math.random()*2-1;return b;}
function burst(dur,type,freq,q,vol,fall){
 const x=AU.ctx;if(!x)return;
 const s=x.createBufferSource();s.buffer=nz(dur);
 const f=x.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q||1;
 if(fall)f.frequency.exponentialRampToValueAtTime(Math.max(80,freq*fall),x.currentTime+dur);
 const g=x.createGain();
 g.gain.setValueAtTime(vol,x.currentTime);
 g.gain.exponentialRampToValueAtTime(0.001,x.currentTime+dur);
 s.connect(f);f.connect(g);g.connect(AU.sfxG);s.start();s.stop(x.currentTime+dur);
}
function tone(f0,f1,dur,vol,type){
 const x=AU.ctx;if(!x)return;
 const o=x.createOscillator(),g=x.createGain();
 o.type=type||"sine";o.frequency.setValueAtTime(f0,x.currentTime);
 if(f1)o.frequency.exponentialRampToValueAtTime(f1,x.currentTime+dur);
 g.gain.setValueAtTime(0,x.currentTime);
 g.gain.linearRampToValueAtTime(vol,x.currentTime+0.006);
 g.gain.exponentialRampToValueAtTime(0.001,x.currentTime+dur);
 o.connect(g);g.connect(AU.sfxG);o.start();o.stop(x.currentTime+dur+0.02);
}
/* 钟：几个不成整数倍的分音叠起来，才像金属 */
function bellAt(base,vol,dur){
 const x=AU.ctx;if(!x)return;
 [[1,1],[2.76,.45],[5.40,.25],[8.93,.14],[1.51,.3]].forEach(([r,a],i)=>{
  const o=x.createOscillator(),g=x.createGain();
  o.type="sine";o.frequency.value=base*r;
  g.gain.setValueAtTime(0,x.currentTime);
  g.gain.linearRampToValueAtTime(vol*a,x.currentTime+0.004);
  g.gain.exponentialRampToValueAtTime(0.0008,x.currentTime+dur*(1-i*0.12));
  o.connect(g);g.connect(AU.sfxG);o.start();o.stop(x.currentTime+dur+0.1);});
 burst(0.09,"bandpass",2600,1.2,0.12);
}
const SFX={

 bell :()=>bellAt(196,0.34,3.4),

 coin :()=>{tone(2100,2100,0.07,0.16,"square");setTimeout(()=>{if(AU.ctx)tone(2800,2800,0.10,0.12,"square");},55);},
 water:()=>{burst(0.55,"lowpass",800,0.7,0.16,0.45);setTimeout(()=>{if(AU.ctx)burst(0.35,"lowpass",600,0.7,0.10,0.5);},210);},
 step :()=>burst(0.07,"lowpass",420,0.9,0.16,0.6),
 win  :()=>{bellAt(262,0.22,2.4);setTimeout(()=>{if(AU.ctx)[0,2,4].forEach((k,i)=>
            setTimeout(()=>{if(AU.ctx)note(pitch(10+k),AU.ctx.currentTime,0.2,2.0,AU.sfxG,1);},i*130));},90);},
 lose :()=>{tone(150,52,1.5,0.24,"sine");burst(0.7,"lowpass",320,0.8,0.14,0.4);},
 lvl  :()=>{bellAt(147,0.32,4.2);[0,2,4,5,7].forEach((k,i)=>setTimeout(()=>{if(AU.ctx)
            note(pitch(8+k),AU.ctx.currentTime,0.22,2.6,AU.sfxG,1);},160+i*150));},
};
function sfx(k){
 if(!AU.on||AU.dead)return;
 const x=auInit();if(!x)return;
 if(x.state==="suspended")return;
 try{(SFX[k]||SFX.tap)();}catch(e){}
}

function bgmFor(loc){
 const t={qingpu:"town",duanhe:"town",yunxiu:"town",tiezhen:"town",
  wuying:"wild",lie:"wild",zhishi:"wild",kuhe:"wild",jianshen:"wild",zhongfu:"wild"};
 return t[loc]||"road";
}

 AU[k]=v;
 if(!AU.ctx)return;
 if(k==="on")AU.mst.gain.value=v?1:0;

 if(k==="vs")AU.sfxG.gain.value=v;
}

 {id:"L1",w:9,loc:["dukou"],t:"不肯上岸的客人",tx:["渡船靠了岸，船上还坐着一个人。斗笠压得很低。","渡老说这人已经坐了三天，船来船往，他不上岸也不给钱。","「你去问问，」渡老说，「我问过了，他说他在等一个摆渡的人，不是我。」"],

 {id:"L2",w:9,loc:["qingpu"],t:"井里的名字",tx:["青蒲镇当中那口井，井沿上密密麻麻刻满了名字，新的压着旧的。","打水的妇人说：「七日梦之后刻的。死在那七天里的人，家里人就来刻一个。」","「刻满了三圈。第四圈没人刻了——不是不死人了，是想不起来该刻谁。」"],
  o:[{t:"数一数有多少个",f:s=>{addLog("你数到三百一十七就数乱了。再从头数，得的是另一个数。名字在动。","v");gain(s,"ling",1);weave(s,1);}},
     {t:"找一找有没有自己的",f:s=>{addLog("你绕着井沿走了三圈。没有你的名字。你松了口气，随即发现自己不该松这口气。","r");gainExp(s,300);}},

 {id:"L3",w:9,loc:["duanhe"],t:"卖线的",tx:["集市最里头，一个人蹲着卖线。他面前铺了块黑布，布上摆着七截银线，长短不一。","「一寸一百文，」他说，「不讲价。这东西你买了也使不上，但你会想买。」","他说得对。你确实想买。"],

     {t:"问他线是哪来的",f:s=>{addLog("他收了布就走。走出五步回头说：「从嘴里。不是我的嘴。」","r");gain(s,"ling",1);}},
     {t:"抢",f:s=>{fight(s,"poluo",()=>{addLog("你翻遍了他身上，一截线也没有。黑布里裹着的是三十七颗牙。","r");item(s,"duanxian",2);weave(s,-1);});}}]},
 {id:"L4",w:9,loc:["panshan"],t:"读不通的字",tx:["三千级石阶，每级一个字。你试着从下往上读，读到第两百级，忽然觉得这不是一篇文章。","是一个人的名字。反复写了三千遍，每一遍都写坏了一点。"],

     {t:"去问释寒山",f:s=>{aff(s,"hanshan",3);addLog("「凿字的是我师父，」他说，「他凿了四十年，说凿到能把那个名字凿对，人就回来了。」他顿了顿，「没凿对。」","v");gainExp(s,300);}},

 {id:"L6",w:9,loc:["kuhe"],t:"裂口里的回声",tx:["河床上那道裂口深得看不见底。你对着它喊了一声。","回声上来了。不是你的声音。"],

 {id:"L7",w:9,loc:["tiezhen"],t:"凉不下来的刀",tx:["淬火池边上搁着一把刀，从昨天烧到今天，浸了七次水，还是烫的。","卓不弃蹲在旁边抽烟：「它不认这池子的水。」"],

 {id:"L9",w:10,loc:["wuying"],t:"你的影子落在了后面",tx:["进林子的时候你回头看了一眼。影子还在林子外面，站着没跟进来。","它没有动。它在等你出去。"],

 {id:"L10",w:10,loc:["zhishi"],t:"四壁是活的",tx:["织室的墙不是墙，是绷紧的布，一直在极缓慢地起伏。","靠近了能看见布纹里嵌着东西：一只手，一张侧脸，一段背影。都很安静。"],

function chapNow(){return S.end?null:CHAP[S.ch];}
function storyRows(){
 const c=chapNow();if(!c)return [];
 const g=c.g||{},rows=[];
 rows.push(["火候",S.lvl>=c.r?REALM[c.r].n+"　已足":"须得「"+REALM[c.r].n+"」之境（今 "+REALM[S.lvl].n+"）",S.lvl>=c.r]);
 if(g.loc){
  const L=LOC[g.loc],sp=g.spot?spotOf(g.loc,g.spot):null;
  const where=L.n+(sp?" · "+sp.n:"");
  let st,ok=0;
  if(S.loc===g.loc){ ok=!g.spot||S.spot===g.spot; st=where+(ok?"　你就在此处":"　你在"+curSpot().n+"，还得挪几步"); }
  else if(locOpen(g.loc)){const d=roadDist(g.loc);st=where+"　"+(d>0?d+" 程之外":"路上还隔着地方");}
  else if(heardOf(g.loc)) st=where+"　只听人说过，路还没走通";
  else st="？　你还不知道该往哪儿去（找人打听）";
  rows.push(["去处",st,ok]);
 }
 if(g.act)rows.push(["手上",ACT[g.act].n+(S.act===g.act?"　正做着":"　你眼下在"+ACT[S.act].n),S.act===g.act]);
 if(g.tod){const ok=todIn(g.tod);
  rows.push(["时候",g.tod.map(k=>TOD.find(t=>t.k===k).n).join("、")+"　（今 "+todName()+"）",ok]);}
 if(g.need)rows.push(["别的",(g.needTx||"还差一件事")+(g.need(S)?"　已了":""),!!g.need(S)]);
 else if(g.needTx&&!g.act)rows.push(["别的",g.needTx,1]);
 return rows;
}
function storyReady(){
 const c=chapNow();if(!c)return false;
 if(sceneQ||S.trip||BT)return false;
 const g=c.g||{};
 if(S.lvl<c.r)return false;
 if(g.loc&&S.loc!==g.loc)return false;
 if(g.spot&&S.spot!==g.spot)return false;
 if(g.act&&S.act!==g.act)return false;
 if(g.tod&&!todIn(g.tod))return false;
 if(g.need&&!g.need(S))return false;
 return true;
}
function chapReady(){return storyReady();}
/* 到了地方、到了时候，事情自己找上来 */
function checkStory(){
 if(!S||S.end||sceneQ||BT)return;
 if($("#ov").innerHTML)return;
 if(S.hold&&Date.now()-S.hold<(S.holdMs||10000))return;
 if(storyReady()){
  const c=CHAP[S.ch];
  sfx("needle");
  addLog("——　"+c.n+"　——","v");
  showScene(S.scene&&SC[S.scene]?S.scene:c.at);
  return;
 }
 nudge();
}
/* 到了地方却不是时候：轻轻提一句，只提一次 */
function nudge(){
 const c=chapNow();if(!c)return;const g=c.g||{};
 if(!g.loc||S.loc!==g.loc||S.lvl<c.r)return;
 S.nudge=S.nudge||{};
 if(g.spot&&S.spot!==g.spot){
  const key=S.ch+":spot";if(S.nudge[key])return;S.nudge[key]=1;
  addLog("你要找的多半不在这儿——该去的是"+spotOf(g.loc,g.spot).n+"。","v");return;}
 if(g.tod&&!todIn(g.tod)){
  const key=S.ch+":tod";if(S.nudge[key])return;S.nudge[key]=1;
  addLog("这地方"+g.tod.map(k=>TOD.find(t=>t.k===k).n).join("或")+"大约另有光景。眼下太"+(todKey()==="noon"?"亮":"早")+"了。","v");return;}
 if(g.need&&!g.need(S)){
  const key=S.ch+":need";if(S.nudge[key])return;S.nudge[key]=1;
  addLog("你站在这里，觉得还缺一样东西——"+(g.needTx||"说不上来是什么")+"。","v");}
}

c1d:{t:"水匪",p:["岸上的芦苇动了动。",
 "四五个人从苇丛里钻出来，手里提着桨、砍刀和一截生锈的铁链。为首的是个瘸子，拖着左腿，笑得很和气。",
 "「渡老，今儿捞着人了？」瘸六冲你抬抬下巴，「小子，身上有几个钱？没有也行，衣服留下。」",
 "你身上确实没有钱。但你发现，自己的手已经握成了拳——不是你想握的。是它自己知道该怎么握。"],
 b:{foe:"b_shuifei",win:"c1e"}},
c1e:{p:["瘸六趴在泥里，半天爬不起来。他抬头看你的眼神，从轻慢变成了别的什么。",
 "「你……你哪个门派的？」",
 "你不知道。你只知道刚才那一拳出去的时候，胳膊里有条路，是现成的。",
 "渡老在船上看着，很久没说话。末了他说：「你这身手，不像忘了十年的人。」",
 "「像什么？」",
 "「像刚拆了线的伤口。」"],
 f:s=>{unlock(s,"qingpu");unlock(s,"duanhe");s.silver+=40;learn(s,"yelu");learn(s,"tuna");learn(s,"xinglu");},
 o:[{t:"给自己起个名字，上岸",to:"@name"}]},
/* ── 二 ── */
c2a:{t:"择一条路走",p:["青蒲镇上人人都问你一句话：你是哪一路的。",
 "你答不上来。答不上来的人买不到药，住不进店，在集上问个路都要被人多看两眼。江湖不是不收生人，是不收没有出处的人——没有出处，就没人替你担保，也没人替你收尸。",
 "断河集的茶棚里，一个跑江湖的给你数了数如今还立得住的几家。",
 "「十年前那三千人一死，老的规矩全塌了。现在站得住的，也就这么几家。你挑吧。挑了就别回头——江湖上改门换派的人，两边都不认。」"],
 o:[{t:"听他细说",to:"@sect"}]},
c2b:{p:["你按规矩递了拜帖，磕了该磕的头，说了该说的话。",
 "从今天起，你在江湖上有了出处。这意味着有人会为你担保，也意味着你欠了债——欠的不是钱，是以后总有一天要还的那种。",
 "夜里你睡在门派给的铺位上，第一次觉得踏实。",
 "然后你又梦见了那条干河床。"],
 f:s=>{unlock(s,"panshan");unlock(s,"yunxiu");},to:null},
/* ── 三 ── */
c3a:{t:"断线的人",p:["最近三个月，死了十一个人。",
 "都是有功夫在身的，都死在自己屋里，都没有伤。青蒲镇的仵作验到第四具就不肯再验了，说验不动。",
 "断河集的酒肆里，一个穿旧官服的醉汉听见你打听这事，忽然从桌上抬起头。",
 "「你也在查？」"],to:"c3b"},
c3b:{who:"裴无咎",p:["他自称裴无咎，十年前是洛水三县的捕头。",
 "「七日梦那年，三千一十七具尸，我验了七天。」他给自己倒酒，手很稳，稳得不像喝了这么多，「每一具都干净。没有外伤，没有内伤，经脉完整，五脏俱全。人就是没了。」",
 "「嘴里的银线呢？」",
 "「一寸整。两头齐。」他比了个长度，「你知道最邪门的是什么吗？不是没有接头——是那线有方向。」",
 "他用指甲在桌上划了一道。",
 "「它是从里头往外缝的。从人的里面，往外面缝。」",
 "「缝什么？」",
 "「不知道。」他仰头喝干，「但缝东西的人，总是在补什么。我干了二十年捕快，只学会一件事：想知道谁干的，先想清楚他想补什么。」"],
 f:s=>{aff(s,"pei",10);flag(s,"pei_case");},to:"c3c"},
c3c:{p:["第十二个死者是个镖师，住在镇西。",
 "你到的时候尸体还没凉。屋子锁得好好的，窗闩从里面插着。他躺在床上，睁着眼，脸上没有惊恐，反而有种说不上来的舒展。",
 "你掰开他的嘴。银线躺在舌根上，一寸整。",
 "你把线捏在指间。",
 "很凉。凉得不像金属。它在你指尖轻轻地动了一下——不是你手在抖。"],
 f:s=>{item(s,"yinxian",1);weave(s,1);},
 o:[{t:"把线收起来",to:"c3d",f:s=>flag(s,"keep_thread")},
    {t:"当场烧掉它",to:"c3d",f:s=>{flag(s,"burn_thread");addLog("火苗舔上银线，线没断，反而更亮了一点。","r");}}]},
c3d:{p:["你从窗缝往外看的时候，街对面站着一个人。",
 "青天白日，他脚下没有影子。",
 "他看了你一会儿，微微点头，像是认得你，然后转身走进巷子。",
 "你追出去。巷子是死的，三面墙。"],
 b:{foe:"b_xie1",win:"c3e"}},
c3e:{p:["他退到墙根，笑了一下。那个笑容很奇怪——不是装的，是不熟练，像刚学会怎么笑。",
 "「你比上一个耐打。」他说，声音也不熟练，「上一个只撑了三招。」",
 "「上一个是谁？」",
 "「都是你。」",
 "他往后一靠，整个人陷进墙里，像布被人从背面拽走。墙面上什么都没留下。",
 "你站在死巷里站了很久。"],
 f:s=>{unlock(s,"kuhe");unlock(s,"tiezhen");unlock(s,"jianzhong");weave(s,1);item(s,"duanxian",1);},to:null},
/* ── 四 ── */
c4a:{t:"旧梦重织",p:["这一次你知道自己在做梦。",
 "干涸的河床一直铺到天边。裂口深得能站进去一个人。河床中央坐着一个白发女人，膝上摊着一大块布——你看不清那布是什么颜色，因为它一直在变，变的方式像天光在云底下跑。",
 "她手里的针没有孔。",
 "她一针一针地缝，很慢，很稳。每落一针，远处就有一个很轻的声音，像有人在极远的地方叹了口气。",
 "「你这一线，还在外面。」她说，没有抬头。"],
 o:[{t:"「什么线？」",to:"c4b"},{t:"「你杀了三千人。」",to:"c4b",f:s=>flag(s,"accuse")}]},
c4b:{who:"针娘",p:["她终于抬起头。",
 "她的脸很年轻，白发却像雪。眼睛里没有恶意，也没有善意，只有一种极长的疲倦。",
 "「你以为内力是什么？」她说，「是气？是血？」",
 "她把针举起来，针尖上什么都没有，可你分明看见一条极细的银线从空中垂下来，另一头连着你的胸口。",
 "「是线。」她说，「每一个练武的人，都是天衣上的一个线头。你们练得越深，扎得越紧。整块布——我们叫它天衣——裹着这个世上所有活着的东西。」",
 "「布破了。」",
 "「破在十年前？」",
 "「破在很久以前。」她低下头，继续缝，「十年前，只是我第一次补它。」"],
 f:s=>{weave(s,2);flag(s,"knows_tianyi");},to:"c4c"},
c4c:{p:["你醒了。",
 "枕头上有一根银线，一寸整。",
 "窗外天刚亮，云绣坊的织机已经在响。你想起阿蘅那天晚上说的话——她说她绣的是人，把散了的人缝回去，然后她自己愣了一下，说：我为什么这么说？",
 "你去找她。"],f:s=>item(s,"yinxian",1),to:"c4d"},
c4d:{who:"阿蘅",p:["阿蘅在织机前坐了一夜，眼下青着。",
 "你把银线放在她手心里。她只看了一眼，脸就白了。",
 "「这是双股。」她说。",
 "「什么？」",
 "「绣活上的话。一根线看着是一根，其实是两股拧的。」她把线举到光里，手在抖，「可这根不是拧的。它是一股，中间被人硬劈开又并回去的——你知道要多稳的手才能把一根线劈开还不断？」",
 "她把线还给你，像还一块烧红的铁。",
 "「楼里有个老规矩。」她说，「从不外传。第一任楼主留下的：绣人像时，眼睛最后绣，绣完立刻挑断线头。」",
 "「为什么？」",
 "「因为不挑断，」阿蘅说，「绣的那个人会醒。」"],
 f:s=>{aff(s,"heng",12);flag(s,"heng_ally");},to:null},
/* ── 五 ── */
c5a:{t:"河底下的屋子",p:["裴无咎摊开一张图，是他偷偷临下来的旧河道图。",
 "「十年前断流那七天，河床全露出来了。」他用酒指在图上点了一处，「这儿，本来在水底三十丈。当时下去过一队人，八个，回来两个，回来的那两个不说话，三个月后自己吊死了。」",
 "「他们看见什么？」",
 "「留了句话。」裴无咎抬头看你，「他们说：底下有间屋子，墙是活的。」",
 "枯河谷的裂口一年比一年深。你顺着一道裂缝往下走，走了大半天，光变成了另一种颜色——不是暗，是稀薄，像光本身被抽掉了几股。",
 "然后你看见了那扇门。"],to:"c5b"},
c5b:{p:["门后是一间屋子，方的，不大。",
 "四壁挂满了布。",
 "那些布都在动。不是被风吹的——它们在自己起伏，像是很多人在同时呼吸。每一块布上都有针脚，密密麻麻，有的整齐得吓人，有的歪歪扭扭，一看就是新手活。",
 "屋子中央有一张空椅子，椅子边上放着一个笸箩。笸箩里堆满了银线，每一根都是一寸整。",
 "你数了数最上面那一层。",
 "你不敢往下数。"],
 f:s=>{unlock(s,"zhishi");weave(s,2);},to:"c5c"},
c5c:{p:["墙上钉着一本册子，纸已经脆了。你翻开，第一页是一列名字，后面跟着年份。",
 "名字很多，往下排了几十行。每一个名字后面都有两个数字：接任的年份，和断线的年份。",
 "最后一行只有一个名字——桑照——后面的年份栏是空的。",
 "再往下，还有半行墨迹，被人用力划掉了，划得纸都破了。你把册子举到光里，勉强认出那半行被划掉的字里，有一个字的偏旁，和你自己的姓一样。",
 "册子的封皮上，四个字：",
 "「缝天司·籍」"],
 f:s=>{item(s,"tuben",1);flag(s,"saw_roster");},to:null},
/* ── 六 ── */
c6a:{t:"三千人的债",p:["裴无咎把拓本翻到最后一页，翻了三遍，然后放下，去倒酒。酒洒了一半。",
 "「三千零一十七。」他说。",
 "「你想说什么？」",
 "「我一直以为那是屠杀。」他终于把酒倒满，「现在我知道不是了。是取料。」",
 "他把杯子推给你。",
 "「布破了，要补。补要线。线从哪儿来？」他自问自答，「从人身上来。练武的人身上那股气——那就是现成的线，又长又韧。三千人，能纺出多少？够补多大一块口子？」",
 "「所以她挑的都是高手。」",
 "「所以她挑的都是高手。」裴无咎笑了一下，笑得很难看，「省得多杀几万个平头百姓。少侠，你说这算什么？」"],to:"c6b"},
c6b:{p:["你没有回答。",
 "你想起十一具尸体脸上那种舒展。想起那根线在你指间动的那一下。想起阿蘅说的：不挑断线头，绣的那个人会醒。",
 "你也想起，屋子里那些墙上的布，在呼吸。",
 "「裂在哪儿？」你问。",
 "「无影林。」裴无咎说，「最近三年，那林子里没有影子。不是没有光，是影子进去了，出不来。林子中间有个地方——去过的人说，那儿不像破了个洞，倒像是有一处，布被人从两边拉开了，中间露出底下的东西。」",
 "「底下是什么？」",
 "裴无咎沉默了很久。",
 "「没有东西。」他说，「不是空的那种没有。是根本没有过的那种没有。」"],
 f:s=>{unlock(s,"wuying");learn(s,"fengxi");flag(s,"know_lie");},to:"c6c"},
c6c:{p:["那天夜里，你第一次主动去试。",
 "你调息，把内力压到一线，细得不能再细，然后按着梦里她运针的路子，往前送。",
 "你的指尖点进空气里一处什么都没有的地方。",
 "布帛被挑开的轻响。",
 "你面前的空气裂了一道口子，只有半寸，里面是——你看了一眼就把它合上了，用了全身的力气。",
 "你吐出一口血。血是凉的。"],
 f:s=>{artExp(s,"fengxi",3000);weave(s,3);},to:null},
/* ── 七 ── */
c7a:{t:"无影者",p:["它们开始往外走了。",
 "先是断河集，一夜之间空了三户人家，饭还温着。然后是青蒲镇。然后是磐钟寺的山道上，执戒僧发现有个师弟在正午的阳光下站着，脚底下干干净净。",
 "释寒山那天敲钟敲了两百多下才停。他说：「钟能压住不该醒的东西。可我今天敲的时候，钟里有回声，那回声比我快。」",
 "无影林边上，你等到了他。"],
 f:s=>aff(s,"hanshan",8),to:"c7b"},
c7b:{who:"谢无影",p:["「你这次来得快。」谢无影说。这一回他的笑容熟练多了。",
 "「上一次我用了多久？」",
 "「一百三十七年。」",
 "你站着没动。",
 "「你不信。」他很温和，「也对。我第一次跟你说这句话的时候你也不信。」他抬起手，看着自己的掌心，「我是从裂里出来的。裂里没有东西，所以出来的东西也没有东西——我没有名字，没有过去，没有影子。我只能学。学你们怎么说话，怎么笑，怎么恨。」",
 "「学来做什么？」",
 "「做人。」他说，「只有做成了人，才能被缝进去。缝进去，就有了。」",
 "他的声音第一次有了温度：",
 "「你以为我们是来毁天衣的？我们是来求她收下我们的。她不肯。她说我们不是线，是灰。」"],to:"c7c"},
c7c:{p:["「那你杀那些人做什么？」",
 "「不是我杀的。」谢无影摇头，「那是她取线。我做的事不一样——」",
 "他向前走了一步。空气在他身后拖出一道很细的裂纹。",
 "「我在把口子拉大。口子越大，她越缝不完；缝不完，她就得取更多的线；取到最后，她会取光所有练武的人。到那时候整块布都是新线，旧的花样全没了——」",
 "「——从头织一遍的时候，她就不得不把我们也织进去。」",
 "他笑了。这一次的笑，完全是人的。",
 "「三千人算什么。为了有，我等了一百三十七年。」"],
 b:{foe:"b_xie2",win:"c7d"}},
c7d:{p:["他跪下去的时候散得很慢。",
 "不是血，是线。一根一根从他衣缝里松出来，在地上散成一小堆，然后连那堆也没有了。",
 "最后剩下的那一根，他自己捏在手里，递向你。",
 "「拿着。」他说，「我这一百三十七年，只攒下这一根。」",
 "你接了。",
 "「为什么给我？」",
 "「因为你和我一样。」他看着你，眼睛已经开始淡了，「你身上也没有接头。你从来就不在布上。」",
 "然后他就没有了。",
 "不是死了。是从来没有过。"],
 f:s=>{item(s,"duanxian",3);weave(s,-2);learn(s,"wuying");flag(s,"xie_dead");},to:null},
/* ── 八 ── */
c8a:{t:"针娘",p:["织室的门这一次是开着的。",
 "椅子上坐着一个白发女人。她比梦里老。老得多。",
 "膝上摊着那块布。近看你才发现，布上有一处地方，针脚乱得不成样子——密密叠叠，补了又补，颜色比周围深了几层，像一块反复结痂的伤口。",
 "「你来了。」桑照说，「比我算的早三年。」"],to:"c8b"},
c8b:{who:"桑照",p:["「我叫桑照。缝天司第四十一任司针。」她说，「也是最后一任。」",
 "「你杀了三千人。」",
 "「三千零一十七。」她纠正，声音很平，「我记得每一个名字。我每天缝之前念一遍，念了十年。你要听吗？我可以从头念。」",
 "你没有说话。",
 "「你想问的不是这个。」她把针停下，第一次正眼看你，「你想问值不值得。」",
 "「值得吗？」",
 "「口子那年撕到七丈。」她说，「再撕三丈，无影林会先没有。然后是青蒲镇，然后是洛水，然后是所有听过洛水这个名字的人。不是死——是没有过。他们的娘不会记得生过他们。」",
 "她低下头，又缝了一针。",
 "「我用三千人，换了十年。」她说，「我没有别的办法。你要是有，早说。」"],to:"c8c"},
c8c:{p:["你把册子拿出来，翻到最后一页，指着那被划掉的半行。",
 "桑照看了很久。",
 "「那是我师姐。」她终于说，「第四十任司针，只当了十一天。」",
 "「她怎么了？」",
 "「她生了个孩子。」桑照说，「司针不能有牵挂——有牵挂，手就不稳；手不稳，缝出来的东西会活。所以她把孩子的线，从布上剪了下来。」",
 "屋子里很静。四壁的布轻轻起伏。",
 "「剪下来，这孩子就不在天衣上了。谁也缝不到他，谁也取不走他的线，什么都伤不了他。她剪完那一剪子，自己的线也断了。」",
 "她抬起眼睛。",
 "「那孩子今年，二十六岁。」"],
 f:s=>{flag(s,"truth");weave(s,-3);},to:null},
/* ── 九 ── */
c9a:{t:"一线之外",p:["你在渡口坐了三天。",
 "渡老没有问你。他只是每天照样撑船，照样在船头抽烟，照样记不住你的脸。",
 "第三天傍晚他忽然说：「我记起来一件事。」",
 "「什么？」",
 "「二十六年前，也是这个渡口。」他眯着眼看水面，「有个白衣裳的女人抱着个襁褓上我的船。她在船上坐了一夜，一句话没说。天亮时她下了船，怀里空了。」",
 "他把烟锅磕了磕。",
 "「我一直以为是我记错了。可这十年，每回你上我的船，我就想起那一夜。想完就忘。」"],to:"c9b"},
c9b:{p:["你现在明白很多事了。",

end_feng:{t:"结局 · 缝",p:["你把针尖抵上自己腕间那道白痕。",
 "很疼。疼是好事——疼说明还连着。",

end_duan:{t:"结局 · 断",p:["你没有去缝。",
 "你把针横过来，抵住整块天衣的边，然后用尽这辈子所有的力气，往下一划。",
 "没有声音。",
 "世上所有练过武的人，在同一刻感觉到胸口一空。像是有人把一直攥着你的那只手松开了。有人跪下来哭，有人愣在原地，有人笑起来，笑得停不下来。",
 "裂合上了。不是缝上的——是布没有了，口子自然也就没有了。",
 "从此天下无武。",
 "磐钟寺的钟还在敲，敲的是钟，不是功课。铁砧堂还在打铁，打的是锄头和菜刀。缀云楼的绣品卖得更好了，因为再没有人拿针杀人。剑冢野那几万柄断剑，被人一柄一柄拔出来，回炉了。",
 "也有人恨你。恨了一辈子。有人走了几千里路来找你算账，找到了，站在你面前，忽然发现自己不会打人了——他只会用拳头，而拳头现在只是拳头。",
 "他哭了。你陪他站了很久。",
 "「值得吗？」他问。",
 "「我不知道。」你说，「但再没有人会因为一块布破了而死。」"],end:"断"},
end_zhi:{t:"结局 · 织",p:["你把针举起来，转过身，面对他们。",
 "「我一个人的线不够。」你说，「九丈。我最多补三丈。」",
 "没有人说话。",
 "然后渡老先走上来，伸出手腕。「四十年，」他说，「撑船撑出来的，不算多好的线。」",
 "裴无咎第二个。「我这根泡了十年酒。」他挽起袖子，「你看着用。」",
 "阿蘅把她三十九个针孔的那只手递过来。释寒山解下钟。卓不弃伸出三根指头的左手。青蒲镇卖馄饨的来了。断河集上那个卖伞的来了。一个你教过一招的孩子——现在已经不是孩子了——来了。",
 "桑照坐在石头上看着，忽然哭了。她当了四十一年司针，第一次有人自己把线递过来。",
 "「不能这样。」她说，「给了线，人会变弱。」",
 "「变弱就变弱。」渡老说，「你那三千人是没得挑，我们是自己挑的。」",
 "——",
 "你缝了三天三夜。",
 "九丈的口子合上了。缝出来的那一片，针脚乱七八糟，粗细不一，颜色也杂——因为每一根线都是从不同的人身上来的，有的韧，有的脆，有的一看就是舍不得给却还是给了。",
 "一点也不匀。",
 "桑照摸着那片新补的地方，摇头：「天衣无缝，天衣无缝——我缝了四十一年，缝出来的都看不出接头。你这个，」",
 "她笑了。这是你第一次见她笑。",
 "「满是接头。」",
 "「接头怎么了。」你说。",
 "「接头就是——」她想了很久，「就是有人接过谁的手。」",
 "——",
 "后来你成了第四十二任司针。",
 "你定的第一条规矩是：缝天司不取线。",
 "第二条：谁要给，得当面给，还得说清楚为什么。",
 "第三条：每年清明，把给过线的人的名字，念一遍。",
 "名字很多。你念了很久。"],end:"织"},

function artLv(s,id){const a=s.arts[id];return a?a.lv:0;}
function ef(s){ // 汇总所有武学与装备效果
 const o={qi:0,atk:0,hp:0,def:0,spd:0,crit:0,dodge:0,pen:0,drain:0,yuan:0,weave:0,stun:0,bleed:0,stack:0};
 const add=(k,v)=>{if(k in o)o[k]+=v;};
 for(const id in s.arts){const A=ART[id],lv=s.arts[id].lv;if(!A||!A.ef)continue;
  const act=(A.k==="nei"&&s.eq.nei===id)||(A.k==="shen"&&s.eq.shen===id);
  const m=act?lv:lv*0.2; for(const k in A.ef)add(k,A.ef[k]*m);}
 for(const sl in s.gear){const g=GEAR[s.gear[sl]];if(g)for(const k in g.a)add(k,g.a[k]);}
 return o;
}
function stats(s){
 const E=ef(s),R=s.lvl,RP=Math.pow(1.5,R);
 const a={};for(const k in ATTR)a[k]=s.at[k]+(s.bonus[k]||0)+(k==="yuan"?Math.floor(E.yuan):0);
 const formLv=s.eq.form.reduce((t,id)=>t+artLv(s,id),0);
 const st={
  hp:Math.floor((200+a.gu*46+a.yuan*8+E.hp*3.4)*RP),
  qi:Math.floor((50+a.mai*12+E.qi)*RP),
  atk:Math.floor((10+a.gu*1.1+a.mai*1.7+a.shi*1.2+a.yuan*0.55+E.atk+formLv*1.6)*RP),
  def:Math.floor((5+a.gu*1.8+E.def*1.2)*RP),
  spd:Math.floor(10+a.shi*1.3+E.spd+R*2.2),
  crit:cl(.03+a.shi*.004+a.yuan*.002+E.crit,0,.50),
  dodge:cl(.02+a.shi*.002+E.dodge,0,.38),
  pen:cl(E.pen,0,.55), drain:cl(E.drain,0,.14), a
 };
 st.pow=Math.floor(st.hp*.12+st.atk*4+st.def*2.4+st.spd*3+st.crit*400+st.dodge*300);
 return st;
}
function expNeed(r){return REALM[Math.min(r+1,REALM.length-1)].need;}
function artNeed(id,lv){const A=ART[id];return Math.floor((28*Math.pow(lv+1,1.72)+34*(lv+1))*A.ex);}

function takeItem(s,id,n){if((s.bag[id]||0)<n)return false;s.bag[id]-=n;if(s.bag[id]<=0)delete s.bag[id];return true;}
function gearGain(s,id){if(!GEAR[id])return;if(!s.own.includes(id))s.own.push(id);
 addLog("得到 <b>"+GEAR[id].n+"</b>","y");
 const sl=GEAR[id].s;                       // 空着的位置就直接使上，省得东西躺在箱底
 if(sl&&!s.gear[sl]){s.gear[sl]=id;addLog("你把它"+(sl==="weapon"?"握在手里":"带上了")+"。","");}}
function unlock(s,id){if(!s.locs.includes(id)){s.locs.push(id);addLog("可去 <b>"+LOC[id].n+"</b> 了。","y");}}
function learn(s,id){if(s.arts[id])return;s.arts[id]={lv:0,exp:0};
 addLog("习得武学 <b>"+ART[id].n+"</b>","y");
 const A=ART[id]; if(A.k==="nei"&&!s.eq.nei)s.eq.nei=id;
 if(A.k==="shen"&&!s.eq.shen)s.eq.shen=id;
 if(A.k==="form"&&s.eq.form.length<3)s.eq.form.push(id);}
function artExp(s,id,n){if(!id||!s.arts[id])return;const A=ART[id],a=s.arts[id];a.exp+=n;
 while(a.lv<A.cap&&a.exp>=artNeed(id,a.lv)){a.exp-=artNeed(id,a.lv);a.lv++;
  if(a.lv%10===0||a.lv===A.cap)addLog("<b>"+A.n+"</b> 已至 "+a.lv+" 层","y");}
 if(a.lv>=A.cap)a.exp=0;}
function checkRealm(s){

function rates(s){
 const st=stats(s),a=st.a,L=LOC[s.loc]||LOC.dukou;
 const lm=1+L.lv*0.35, rm=Math.pow(1.85,s.lvl);
 return {
  sit:(0.5+a.mai*0.18+a.ling*0.09)*rm*(1+artLv(s,s.eq.nei)*0.02),
  form:(0.9+a.ling*0.16+a.shi*0.07)*Math.pow(1.5,s.lvl),
  step:(0.9+a.ling*0.14+a.shi*0.1)*Math.pow(1.5,s.lvl),
  herb:(0.055+a.yuan*0.006)*lm, mine:(0.05+a.gu*0.005)*lm, silk:(0.05+a.shi*0.005)*lm,
  walk:(0.022+a.yuan*0.0022)*lm,
 };
}
function tick(s,dt,off){ // dt 秒
 s.playSec=(s.playSec||0)+dt; s.days=Math.floor(s.playSec/1200);
 if(s.trip){ if(!off)tripTick(dt); return; }
 const act=s.act;
 if(["herb","mine","silk"].includes(act)){
  const sp=spotOf(s.loc,s.spot);
  if(!(sp.acts||[]).includes(act)){s.act="sit";if(!off)addLog("这处做不得那桩活计，你就地打坐。","m");return;}
 }
 const R=rates(s);
 if(act==="sit"){gainExp(s,R.sit*dt);artExp(s,s.eq.nei,R.sit*dt*1.1);}
 else if(act==="form"){const id=s.actSub||s.eq.form[0];artExp(s,id,R.form*dt);gainExp(s,R.sit*dt*0.25);}
 else if(act==="step"){artExp(s,s.eq.shen,R.step*dt);gainExp(s,R.sit*dt*0.25);}
 else if(act==="herb"||act==="mine"||act==="silk"){
  const pool={herb:["sanqi","sanqi","wangyou","xuejian"],mine:["tiesha","tiesha","hantie"],silk:["cansi","cansi","bingcan"]}[act];
  const n=R[act]*dt; const whole=Math.floor(n); s.frac=(s.frac||0)+(n-whole);
  let tot=whole; if(s.frac>=1){tot+=Math.floor(s.frac);s.frac%=1;}
  for(let i=0;i<Math.min(tot,400);i++){const it=pick(pool);s.bag[it]=(s.bag[it]||0)+1;}
  if(tot>0&&!off)quietGain(act,tot);
  gainExp(s,R.sit*dt*0.12);
 } else if(act==="walk"){
  gainExp(s,R.sit*dt*0.4);
  const n=R.walk*dt*(curSpot().wild?1.4:1); s.evF=(s.evF||0)+n;
  if(!off){ if(s.evF>=1){s.evF=0;rollEvent(s);} }
  else { const k=Math.min(Math.floor(s.evF),12); if(k>0){s.evF=0; s.offEv=(s.offEv||0)+k;
    for(let i=0;i<k;i++){s.silver+=ri(10,60);gainExp(s,60+s.lvl*40);if(rnd(1)<.4)item2(s,pick(["sanqi","tiesha","cansi","canye"]));}}}
 }
}

function encPool(){
 const lv=LOC[S.loc].lv||0;
 return ENC.filter(e=>e.tr<=lv+0.4&&e.tr>=lv-2.6&&(!e.where||e.where.includes(S.loc)));
}
function rollEnc(){
 if(sceneQ||BT||S.end)return false;
 let pool=encPool();if(!pool.length)return false;
 S.recent=S.recent||[];
 const fresh=pool.filter(e=>!S.recent.includes(e.id));
 if(fresh.length)pool=fresh;
 const tot=pool.reduce((t,e)=>t+e.w,0);let r=rnd(tot),e=pool[0];
 for(const x of pool){r-=x.w;if(r<=0){e=x;break;}}
 S.recent=(S.recent||[]).concat(e.id).slice(-3);
 S.evs++;showEvent(e);return true;
}

 return Math.abs(dx)>Math.abs(dy)?(dx>0?"e":"w"):(dy>0?"s":"n");}

function giveGift(k){
 const g=GIFT[k];if(!g)return;
 const v=S.aff[k]||0;
 if(v>=40){addLog("你和 <b>"+NPC[k].n+"</b> 之间，已经没有更近的地方了。","m");return;}
 const left=visitCd()-(Date.now()-((S.visit&&S.visit[k])||0));
 if(left>0){addLog("刚见过面。再等等罢。（"+Math.ceil(left/60000)+" 分钟）","m");return;}
 if((S.bag[g.it]||0)<1){addLog("你身上没有"+ITEM[g.it].n+"。","r");return;}
 takeItem(S,g.it,1);
 S.visit=S.visit||{};S.visit[k]=Date.now();
 addLog(g.tx,"v");
 aff(S,k,g.n);sfx("thread");save();render();
}
function searched(k){return (S.found||{})[k];}
function sweepCd(){return 240000;}
function spotKey(){return S.loc+":"+S.spot;}
/* 搜：先搜出这处去处藏着的那一桩，搜过了就只是翻翻捡捡 */
function searchHere(){
 if(S.trip){toast("你正在路上。");return;}
 const sp=curSpot(),k=sp.find;
 S.found=S.found||{};S.sweep=S.sweep||{};
 if(k&&FIND[k]&&!S.found[k]){
  const F=FIND[k];S.found[k]=1;
  sfx("needle");
  ov('<h2>'+F.t+'</h2><div class="seam gold"></div><div class="story"><p>'+F.tx+'</p></div>'+
   '<div class="btns"><button class="btn pri" id="ok">收</button></div>')
   .querySelector("#ok").onclick=()=>{closeOv();render();checkStory();};
  F.f(S);save();renderMain();return;
 }
 const key=spotKey();
 const left=sweepCd()-(Date.now()-(S.sweep[key]||0));
 if(left>0){toast("这处刚翻过，再等 "+Math.ceil(left/60000)+" 分钟");return;}
 S.sweep[key]=Date.now();
 const acts=sp.acts||[];
 if(rnd(1)<.55){
  const pool=acts.includes("silk")?["cansi","zhen"]:acts.includes("herb")?["sanqi","xuejian"]:["tiesha","hantie"];
  item(S,pick(pool),ri(1,2));
 } else if(rnd(1)<.34){const m=ri(8,40)*(1+S.lvl);S.silver+=m;addLog("墙缝里抠出 "+fmt(m)+" 文。","y");}
 else addLog(pick(["你把这一处翻了一遍，什么也没有。","除了土就是土。","你翻出半只破鞋。看了看，又放回去了。",
   "手上沾了一层灰，别的没有。"]),"m");
 save();renderMain();
}

function askCd(){return 90000;}
function askAround(){
 if(S.trip){toast("你正在路上。");return;}
 const sp=curSpot();
 if(!sp.ask){toast("这处没什么人可问。");return;}
 S.ask=S.ask||{};
 const left=askCd()-(Date.now()-(S.ask[S.loc]||0));
 if(left>0){toast("这一带的话你都问遍了。再等 "+Math.ceil(left/60000)+" 分钟");return;}
 S.ask[S.loc]=Date.now();
 S.heard=S.heard||{};
 sfx("tap");
 // 一、先把当前线索指的地方点出来
 const c=CHAP[S.ch],g=c&&c.g;
 if(g&&g.loc&&!S.heard[g.loc]&&g.loc!==S.loc&&!locOpen(g.loc)){
  S.heard[g.loc]=1;
  addLog("有人给你指了路：<b>"+LOC[g.loc].n+"</b>。舆图上多了一处影子。","y");
  save();renderMain();return;
 }
 // 二、没听说过的近处
 const near=[];
 for(const k of S.locs)for(const t of (LOC[k].to||[]))
  if(LOC[t]&&!locOpen(t)&&!LOC[t].hidden&&!S.heard[t])near.push(t);
 if(near.length&&rnd(1)<.6){
  const t=pick(near);S.heard[t]=1;
  addLog("有人提起一个地名：<b>"+LOC[t].n+"</b>。「往"+DIRN[dirOf(S.loc,t)]+"走，走得通走不通看你。」","y");
  save();renderMain();return;
 }
 // 三、指一处还没搜过的去处
 const un=[];
 for(const k of S.locs)for(const sp2 of spots(k))
  if(sp2.find&&FIND[sp2.find]&&!searched(sp2.find))un.push([k,sp2]);
 if(un.length&&rnd(1)<.5){
  const [k,sp2]=pick(un);
  addLog("「"+LOC[k].n+"那边，"+sp2.n+"，」那人压低声音，「有人在那儿找着过东西。」","y");
  save();renderMain();return;
 }
 addLog(pick(RUMOR),"m");
 if(rnd(1)<.25)gain(S,"yuan",1);
 save();renderMain();
}
/* ───────── 行路 ─────────
   两地之间是有距离的。你得走过去，走要时候，路上会出事。
   走着的时候练的是身法——脚底下的功夫，本来就是走出来的。   */
function locOpen(k){return S.locs.includes(k);}
function heardOf(k){return !!((S.heard||{})[k]);}
function pathTo(from,to){
 if(from===to)return [];
 if(!locOpen(to))return null;
 const prev={},seen={},q=[from];seen[from]=1;
 while(q.length){const c=q.shift();
  for(const t of (LOC[c].to||[])){
   if(!locOpen(t)||seen[t])continue;
   seen[t]=1;prev[t]=c;
   if(t===to){const p=[];let x=to;while(x!==from){p.unshift(x);x=prev[x];}return p;}
   q.push(t);}}
 return null;
}
function roadDist(k){const p=pathTo(S.loc,k);if(!p)return -1;
 let d=0,c=S.loc;for(const t of p){d+=roadLen(c,t);c=t;}return d;}
/* 脚程：身法、捷、路面、缓急，都算在里头 */
function paceMul(){return S.pace==="fast"?1.55:1;}
function tripSpeed(){
 const st=stats(S);
 return (2.3+st.spd*0.03+artLv(S,S.eq.shen)*0.06)*paceMul();
}
function legInit(from,to,scout){
 const d=Math.hypot(LOC[from].mx-LOC[to].mx,LOC[from].my-LOC[to].my)*(scout?1.5:1);
 const rk=roadOf(from,to);
 const t={from,to,d,prog:0,rk:ROAD[roadKey(from,to)]||"ye"};
 const chance=(scout?.30:.22)*rk.enc*TOD[todIdx()].enc*(S.pace==="fast"?.7:1.1);
 t.evAt=rnd(1)<cl(chance,0,.6)?d*(0.22+rnd(0.62)):-1;
 return t;
}
function startTrip(k){
 if(S.end)return;
 if(S.trip){toast("你正在路上。");return;}
 if(k===S.loc){toast("你就在此处。");return;}
 if(!LOC[k])return;
 if(!locOpen(k)){
  if((LOC[S.loc].to||[]).includes(k))return scoutTo(k);
  toast(heardOf(k)?"只听人说过，路还没走通。":"去不了——路上还隔着没走通的地方。");return;
 }
 const p=pathTo(S.loc,k);
 if(!p||!p.length){toast("去不了——路上还隔着没走通的地方。");return;}
 S.trip={goal:k,path:p,i:0,leg:legInit(S.loc,p[0]),stop:0};
 addLog("你动身往 <b>"+LOC[k].n+"</b> 去。"+(p.length>1?"中间要过 "+(p.length-1)+" 处。":""),"");
 sfx("step");save();renderMain();
}
/* 探路：连出去的那条路你还没走通，走走看 */
function scoutTo(t){
 if(S.trip)return;
 if(!LOC[t])return;
 if(LOC[t].hidden){
  addLog("那个方向似乎有路。你走了半日，走回了原地——不是路没有，是路不肯让你看见。","m");
  save();return;}
 S.scout=S.scout||{};
 S.trip={goal:t,path:[t],i:0,leg:legInit(S.loc,t,1),stop:0,scout:1};
 addLog("你往"+DIRN[dirOf(S.loc,t)]+"探路。"+(heardOf(t)?"听人说过那头是"+LOC[t].n+"。":"那头有什么，你不知道。"),"");
 sfx("step");save();renderMain();
}
function scoutOdds(t){
 const st=stats(S),tries=(S.scout||{})[t]||0;
 return cl(.26+(S.lvl-(LOC[t].lv||0))*.07+st.a.yuan*.012+tries*.2,.08,.94);
}
function stopTrip(){
 const T=S.trip;if(!T)return;
 if(T.leg.prog<T.leg.d*.5){
  addLog("你在半路上站住，想了想，折了回去。","m");
  S.trip=null;save();render();return;
 }
 T.stop=1;T.path=[T.leg.to];T.i=0;T.goal=T.leg.to;
 addLog("你不再往远处去，走到 "+LOC[T.leg.to].n+" 就歇下。","m");
 renderMain();
}
function setPace(p){S.pace=p;save();renderMain();}
/* 每一息推一点。挡在前头的窗子（奇遇、交手）没关，脚就停着 */
function tripTick(dt){
 const T=S.trip;if(!T)return;
 if(BT||sceneQ)return;      // 打岔的是奇遇与交手，翻翻行囊不算
 const L=T.leg,sp=tripSpeed()*roadOf(L.from,L.to).sp;
 const was=L.prog;L.prog+=sp*dt;
 artExp(S,S.eq.shen,rates(S).step*dt*0.75);
 gainExp(S,rates(S).sit*dt*0.2);
 if(L.evAt>=0&&was<L.evAt&&L.prog>=L.evAt){L.evAt=-1;roadEvent(L);return;}
 if(L.prog>=L.d)legDone();
}
function legDone(){
 const T=S.trip,L=T.leg;
 if(T.scout){
  const t=L.to,ok=rnd(1)<scoutOdds(t);
  S.scout=S.scout||{};
  if(ok){
   S.trip=null;
   unlock(S,t);S.heard=S.heard||{};S.heard[t]=1;
   addLog("路是有的，只是从前没人给你指。你走通了 <b>"+LOC[t].n+"</b>。","g");
   enterLoc(t,true);
  } else {
   S.scout[t]=(S.scout[t]||0)+1;S.trip=null;
   addLog(pick(["路越走越不对，草比人高，你退了回来。","走了半日，前头是一道塌方。你折了回来。",
     "你在林子里绕了个圈，又回到了出发的地方。","天色不好，你没敢再往里走。"]),"m");
   S.hpPct=cl((S.hpPct||1)-0.04,.1,1);
   if(rnd(1)<.3)rollEnc();
   save();render();
  }
  return;
 }
 const first=!(S.been||{})[L.to];
 enterLoc(L.to,first,true);
 T.i++;
 if(T.stop||T.i>=T.path.length){
  S.trip=null;save();render();arrive(first);checkStory();return;
 }
 T.leg=legInit(S.loc,T.path[T.i]);
 save();renderMain();
}
/* 走进一处地方 */
function enterLoc(k,first,quiet){
 S.loc=k;S.been=S.been||{};
 S.spot=spots(k)[0].id;
 if(!locOpen(k))unlock(S,k);
 if(!S.been[k]){S.been[k]=1;
  addLog("你到了 <b>"+LOC[k].n+"</b>。"+LOC[k].d,"y");
  weave(S,1);gainExp(S,200+S.lvl*120);
 } else addLog("你到了 <b>"+LOC[k].n+"</b>。","");
 sfx(k==="dukou"?"water":"step");
 bgm(bgmFor(k));
 if(!quiet){save();render();arrive(first);checkStory();}
}

function roadEvent(L){
 const r=rnd(1);
 if(r<.30){ // 路上遇着人
  const here=S.loc;S.loc=rnd(1)<.5?L.from:L.to;
  const ok=rollEnc();S.loc=here;
  if(ok){addLog("你在路上被人拦下了。","r");return;}
 }
 if(r<.58){ const here=S.loc;S.loc=L.to;rollEvent(S);S.loc=here;return; }
 if(r<.80){ addLog(pick(ROADAMB[L.rk]||ROADAMB.ye),"m");return; }
 if(r<.90){ const m=ri(10,50)*(1+S.lvl);S.silver+=m;
  addLog("路边草里有个布包，里头 "+fmt(m)+" 文，没有别的。","y");return; }
 // 岔路：说不定通着什么地方
 const cand=[];
 for(const t of (LOC[L.to].to||[]))if(LOC[t]&&!locOpen(t)&&!LOC[t].hidden&&!heardOf(t))cand.push(t);
 if(cand.length){const t=pick(cand);S.heard=S.heard||{};S.heard[t]=1;
  addLog("路边有一条岔道，踩得很实，是常走的。顺着望过去，大约是 <b>"+LOC[t].n+"</b> 的方向。","y");
  renderMain();return;}
 addLog(pick(ROADAMB[L.rk]||ROADAMB.ye),"m");
}
/* 在同一处地方里挪窝——不要时候，但要走到跟前 */
function goSpot(id){
 if(S.trip){toast("你正在路上。");return;}
 const sp=spotOf(S.loc,id);if(!sp||sp.id===S.spot){return;}
 S.spot=sp.id;
 addLog("你走到"+sp.n+"。"+(sp.d||""),"m");
 const acts=sp.acts||[];
 if(["herb","mine","silk"].includes(S.act)&&!acts.includes(S.act)){
  S.act="sit";addLog("这处做不得那桩活计，你就地打坐。","m");}
 if(sp.wild&&rnd(1)<.14)rollEnc();
 save();render();checkStory();
}
function rollEvent(s){
 if(sceneQ||BT)return;
 const pool=EV.filter(e=>(!e.need||e.need(s))&&(!e.loc||e.loc.includes(s.loc)));
 const wt=e=>e.loc?e.w*3:e.w;
 const tot=pool.reduce((t,e)=>t+wt(e),0);let r=rnd(tot),e=pool[0];
 for(const x of pool){r-=wt(x);if(r<=0){e=x;break;}}
 s.evs++;
 showEvent(e);
}

let BT=null;
function foeNum(f){const t=f.tr,k=f.k||1,b=f.boss?1:0;
 return {hp:Math.round(479*Math.pow(2.142,t)*k*(b?2.2:1)),
  atk:Math.round(38*Math.pow(2.103,t)*(f.ka||k)*(b?1.02:1)),
  def:Math.round(7.4*Math.pow(2.050,t)*(f.kd||1)),
  spd:Math.round(9+t*3.6)};}
function foeStats(f){const L=f.lv,N=foeNum(f);return{n:f.n,hp:N.hp,mhp:N.hp,atk:N.atk,def:N.def,spd:N.spd,
 crit:.05+L*.004,dodge:.02+L*.004,pen:0,qi:999,foe:f};}
function meStats(s){const st=stats(s);return{n:s.name,hp:Math.max(1,Math.floor(st.hp*(s.hpPct||1))),mhp:st.hp,
 atk:st.atk,def:st.def,spd:st.spd,crit:st.crit,dodge:st.dodge,pen:st.pen,drain:st.drain,qi:st.qi,mqi:st.qi,me:1};}
function fight(s,foeId,onWin,onLose,sc){
 const f=FOE[foeId];if(!f)return;
 BT={A:meStats(s),B:foeStats(f),log:[],turn:0,foeId,onWin,onLose,stack:0,bleed:0,stun:0,stunB:0,duel:!!(sc&&sc.duel),
     sceneWin:sc&&sc.win,sceneLose:(sc&&sc.lose)||null};
 runBattle();
}
function blog(L,cls,txt){const b=BT;L.push([cls,txt,b.A.hp,b.B.hp]);}
function runBattle(){
 const b=BT,A=b.A,B=b.B,L=b.log;
 blog(L,"m","—— "+A.n+"　对　"+B.n+" ——");
 let guard=0;
 while(A.hp>0&&B.hp>0&&guard<120){
  guard++;b.turn++;
  blog(L,"r","第 "+b.turn+" 回合");
  const order=A.spd>=B.spd?[[A,B],[B,A]]:[[B,A],[A,B]];
  for(const [x,y] of order){
   if(A.hp<=0||B.hp<=0)break;
   if(x.me&&b.stun>0){b.stun--;blog(L,"m",x.n+"胸中钟鸣未绝，这一招使不出来。");continue;}
   if(!x.me&&b.stunB>0){b.stunB--;blog(L,"y",x.n+"气血翻涌，这一招没递出来。");continue;}
   act(x,y,L);
  }
  if(b.bleed>0&&B.hp>0){const d=Math.floor(B.mhp*0.012*b.bleed);B.hp-=d;
   blog(L,"y",B.n+"的伤口还在渗，又失了 "+d+" 点气血。");b.bleed=Math.max(0,b.bleed-0.4);}
 }
 if(A.hp>0&&B.hp>0){b.draw=1;blog(L,"m","两人都动不了了。这一场算平手。");A.hp=Math.max(1,A.hp);}
 finishBattle();
}
function act(x,y,L){
 const b=BT;
 let sk=null;
 if(x.me){
  const cands=S.eq.form.filter(id=>S.arts[id]&&(ART[id].cost||0)<=x.qi);
  if(cands.length&&rnd(1)<.78){const id=pick(cands);sk={id,A:ART[id]};x.qi-=(sk.A.cost||0);}
 }
 if(rnd(1)<cl(y.dodge,0,.5)){
  blog(L,"m",y.n+(y.me?"侧身让开半尺，这一下擦着衣襟过去了。":"堪堪避开。"));return;
 }
 const mul=sk?sk.A.mul:1, pen=(x.pen||0)+(sk&&sk.A.ef&&sk.A.ef.pen?sk.A.ef.pen:0);
 const stackB=x.me?Math.min(b.stack,12)*0.05:0;
 const ramp=b.turn>30?1+(b.turn-30)*0.11:1;
 let crit=x.crit+(sk&&sk.A.ef&&sk.A.ef.crit?sk.A.ef.crit:0);
 const isC=rnd(1)<crit;
 const raw=x.atk*mul*(1+stackB), dE=y.def*(1-cl(pen,0,.9));
 let dmg=raw*(x.atk/(x.atk+dE));
 dmg*=(0.86+rnd(.28))*ramp; if(isC)dmg*=1.85;
 dmg=Math.max(2,Math.floor(dmg));
 y.hp-=dmg;
 if(sk&&sk.A.ef){const E=sk.A.ef;
  if(E.bleed)b.bleed+=E.bleed; if(E.stack)b.stack++;
  if(E.stun&&rnd(1)<E.stun&&!y.me){b.stunB++;blog(L,"y",y.n+"被震得气血翻涌，慢了半拍。");}
  if(E.drainHit){const h=Math.floor(dmg*E.drainHit*10);x.qi=Math.min(x.mqi||999,x.qi+h);}
 }
 if(x.drain&&x.me){const h=Math.floor(dmg*x.drain);x.hp=Math.min(x.mhp,x.hp+h);}
 let line;
 if(sk&&sk.A.ln)line=pick(sk.A.ln).replace(/\{A\}/g,x.n).replace(/\{B\}/g,y.n).replace(/\{S\}/g,sk.A.n);
 else if(!x.me&&x.foe&&x.foe.ln)line=x.n+pick(x.foe.ln)+"，"+y.n+"格挡不及。";
 else line=x.n+"抢进一步，一记实的落在"+y.n+"身上。";
 blog(L,isC?"h":(x.me?"g":"h"),line+"（"+(isC?"重手 ":"")+dmg+"）");
}
function finishBattle(){
 const b=BT,A=b.A,B=b.B,L=b.log;
 if(b.duel&&A.hp>0){
  blog(L,"g","—— 你赢了这一场 ——");
  S.hpPct=cl(A.hp/A.mhp,.05,1);
  b.spoil=["点到为止。"];
  showBattle();return;
 }
 if(b.draw){
  S.hpPct=cl(A.hp/A.mhp,.05,1);
  b.spoil=["谁也没赢。你收了势，他也收了势。"];
  showBattle();return;
 }
 if(A.hp>0){
  blog(L,"g","—— "+B.n+"倒下了 ——");
  S.hpPct=cl(A.hp/A.mhp,.05,1);S.kills++;
  const f=B.foe;
  const sv=ri(f.sv[0],f.sv[1]);S.silver+=sv;
  const ex=Math.floor((60+f.lv*f.lv*22)*(1+S.lvl*.1));gainExp(S,ex);
  const lines=["银两 +"+sv,"内力修为 +"+fmt(ex)];
  if(f.drop)for(const [id,p] of f.drop)if(rnd(1)<p){const n=ri(1,2);S.bag[id]=(S.bag[id]||0)+n;lines.push(ITEM[id].n+" ×"+n);}
  b.spoil=lines;
 } else if(b.duel){
  blog(L,"m","—— 你输了这一场 ——");
  S.hpPct=.35;
  b.spoil=["点到为止。输了也只是输了。"];
 } else {
  blog(L,"h","—— 你倒下了 ——");
  S.hpPct=.25;const lost=Math.floor(S.silver*.15);S.silver-=lost;
  b.spoil=["你在路边醒来，身上少了 "+lost+" 文。","气血亏损，需静养。"];
 }
 showBattle();
}

function told(k,id){return (S.told||{})[k+":"+id];}
function talkTo(k,id){
 const T=(TALK[k]||[]).find(x=>x.id===id);if(!T)return;
 if(T.key){ // 渡老指路：他只给你一句话和一个地名
  if(S.end){replyBox(k,["「都完了。」他说，「你还想往哪儿去。」"]);return;}
  const c=chapNow();
  if(!c){replyBox(k,["「往后的事，我也不知道了。」"]);return;}
  const g=c.g||{},tx=["他把烟锅在船帮上磕了磕。"];
  if(S.lvl<c.r){
   tx.push("「还不到时候。」他说，「你现在这个样子出去，是给人添麻烦。」");
   tx.push("「等你"+REALM[c.r].n+"了再来问我。」");
  } else {
   tx.push("「"+c.clue.t+"。」他说。");
   tx.push(c.clue.tx);
   if(g.loc){
    S.heard=S.heard||{};
    const knew=heardOf(g.loc)||locOpen(g.loc);
    S.heard[g.loc]=1;
    tx.push("「"+(locOpen(g.loc)?"往"+LOC[g.loc].n+"去":"那地方叫"+LOC[g.loc].n+"，路你自己找")+"。"+
     (g.spot?"到了那儿，"+spotOf(g.loc,g.spot).n+"。":"")+
     (g.tod?TOD.find(t=>t.k===g.tod[0]).n+"前后最好。":"")+"」");
    if(!knew)tx.push("他拿桨在水面上划了个方向。你把它记在了图上。");
   } else if(g.act){
    tx.push("「这一桩不在别处，」他说，「在你自己身上。」");
   }
  }
  replyBox(k,tx);save();renderMain();return;
 }
 if(T.need&&!T.need(S)) if(T.need&&!T.need(S)){replyBox(k,["他看了你一眼，没接话。"]);return;}
 S.told=S.told||{};
 const first=!told(k,id);
 if(first){S.told[k+":"+id]=1;
  if(T.once)aff(S,k,T.once>2?2:1);
  if(T.f)T.f(S);
  gainExp(S,60+S.lvl*40);}
 replyBox(k,T.tx);
 save();
}
function replyBox(k,tx,then){
 const sh=ov('<h2>'+NPC[k].n+'</h2><div class="seam gold"></div>'+
  '<div class="story">'+paras(tx)+'</div><div class="seam"></div>'+
  '<div class="btns"><button class="btn pri" id="back">'+(then?"那就走一趟":"嗯")+'</button></div>');
 sh.querySelector("#back").onclick=then||(()=>{closeOv();showNpc(k);});
}

function showNpc(k){
 const v=S.aff[k]||0,can=VISIT[k],g=GIFT[k],have=g?(S.bag[g.it]||0):0;
 const left=can?visitCd()-(Date.now()-((S.visit&&S.visit[k])||0)):0;
 let h='<h2>'+NPC[k].n+'</h2><div class="seam gold"></div>'+
  '<div class="story"><p class="no muted">'+NPC[k].t+'</p><p>'+NPC[k].d+'</p></div>'+

  '<div class="m">交情 '+v+'</div>';

 if(tp.length){h+='<div class="seam"></div><div class="tagl">说 话</div>';
  for(const x of tp)h+='<button class="opt" data-talk="'+k+'|'+x.id+'">'+x.t+

 else if(v>=40)h+='<span class="m">已是至交。</span>';
 else if(left>0)h+='<span class="m">刚见过。再等 '+Math.ceil(left/60000)+' 分钟。</span>';

 h+='<button class="btn" id="close">走开</button></div>';
 ov(h).querySelector("#close").onclick=closeOv;
 bind();
}

 M.querySelectorAll("[data-sell]").forEach(b=>b.onclick=()=>{
  const id=b.dataset.sell;if(takeItem(S,id,1)){S.silver+=ITEM[id].p;save();repanel();render();}});
 M.querySelectorAll("[data-sellmat]").forEach(b=>b.onclick=()=>{
  let n=0;for(const id in S.bag){const it=ITEM[id];if(it&&["药材","矿料","织料"].includes(it.t)){n+=it.p*S.bag[id];delete S.bag[id];}}
  S.silver+=n;addLog("卖了个干净，得银 "+fmt(n)+" 文。","g");save();renderMain();render();});
 M.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>{
  const id=b.dataset.buy,o=ITEM[id]||GEAR[id];if(S.silver<o.p){toast("银两不够");return;}
  sfx("coin");
  S.silver-=o.p; if(ITEM[id])item(S,id,1); else gearGain(S,id);
  save();renderMain();render();});
 M.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{
  if(S.scene&&SC[S.scene]){closeOv();S.hold=0;showScene(S.scene);}});
 M.querySelectorAll("[data-guide]").forEach(b=>b.onclick=()=>{closeOv();guideBox();});
 M.querySelectorAll("[data-exp]").forEach(b=>b.onclick=exportSave);
 M.querySelectorAll("[data-slotsave]").forEach(b=>b.onclick=()=>{
  const i=+b.dataset.slotsave;
  if(SLOTS[i])ask("覆盖"+SLOTNAME[i],"这一格里已经有一个人了。存进去，他就没有了。","覆盖",()=>slotSave(i));
  else slotSave(i);});
 M.querySelectorAll("[data-slotload]").forEach(b=>b.onclick=()=>{
  const i=+b.dataset.slotload;
  ask("读取"+SLOTNAME[i],"眼下这一世会被放下。若还想留着，先存进别的格子。","读取",()=>slotLoad(i));});
 M.querySelectorAll("[data-forkload]").forEach(b=>b.onclick=()=>{
  ask("回到分岔前","眼下这一世会被放下，退回到你做最后那个选择之前。","回去",()=>forkLoad());});
 M.querySelectorAll("[data-slotwipe]").forEach(b=>b.onclick=()=>{
  const i=+b.dataset.slotwipe;
  ask("抹去"+SLOTNAME[i],"抹了就回不来了。","抹去",()=>slotWipe(i));});
 M.querySelectorAll("[data-imp]").forEach(b=>b.onclick=importSave);
 M.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>{save(true);toast("已存");});
 M.querySelectorAll("[data-reset]").forEach(b=>b.onclick=()=>{
  const sh=ov('<h2>重开一世</h2><div class="seam gold"></div><div class="story"><p>这一世的功夫、故人、名字，都不再有人记得。</p></div>'+
   '<div class="btns"><button class="btn" id="no">再想想</button><button class="btn pri" id="yes">重开</button></div>');
  sh.querySelector("#no").onclick=closeOv;
  sh.querySelector("#yes").onclick=async()=>{try{await window.storage.delete(KEY);}catch(e){} S=null;LOGS=[];closeOv();$("#app").style.display="none";prologue();};});
}
function useItem(id){
 const it=ITEM[id];if(!it.use)return;
 if(!takeItem(S,id,1))return;
 const u=it.use;
 if(u.hp){S.hpPct=cl((S.hpPct||1)+u.hp,0,1);addLog("敷了药，气血回了些。","g");}
 if(u.expPct){gainExp(S,Math.max(400,expNeed(S.lvl)*u.expPct));addLog("药力化开，内力修为大进。","g");}
 if(u.attr){const k=pick(Object.keys(ATTR));gain(S,k,1);}
 if(u.art){
  const ids=Object.keys(S.arts).filter(i=>S.arts[i].lv<ART[i].cap);
  if(!ids.length){addLog("你已无可参悟之处。","");}
  else{const t=pick(ids);artExp(S,t,artNeed(t,S.arts[t].lv)*u.artPct);addLog("参悟残卷，<b>"+ART[t].n+"</b> 大有精进。","y");}
 }
 save();renderMain();render();
}
/* ═══════════ 存档 ═══════════ */
const KEY="tianyi:save1";
let saveT=0,savePending=false;
function pack(){return JSON.stringify({s:S,l:LOGS.slice(0,40),t:Date.now()});}
async function save(force){
 if(!S)return;S.t=Date.now();
 if(!hasStore)return;
 if(!force&&Date.now()-saveT<15000){savePending=true;return;}
 saveT=Date.now();savePending=false;
 try{await window.storage.set(KEY,pack());}catch(e){}
}
async function load(){
 if(!hasStore)return null;
 try{const r=await window.storage.get(KEY);if(!r||!r.value)return null;return JSON.parse(r.value);}catch(e){return null;}
}
/* ───────── 存档格 ───────── */
const SLOTN=4, SLOTNAME=["第一格","第二格","第三格","第四格"];
const slotKey=i=>"tianyi:slot"+i;
let SLOTS=new Array(SLOTN).fill(null);
function slotMeta(d){const s=d.s||{};
 return {name:s.name||"无名",lvl:s.lvl||0,ch:s.ch||0,sect:s.sect||null,
  silver:s.silver||0,kills:s.kills||0,end:s.end||null,t:d.t||s.t||Date.now()};}
async function loadSlots(){
 if(!hasStore){SLOTS=new Array(SLOTN).fill(null);return;}
 for(let i=0;i<SLOTN;i++){
  try{const r=await window.storage.get(slotKey(i));
   SLOTS[i]=(r&&r.value)?slotMeta(JSON.parse(r.value)):null;}catch(e){SLOTS[i]=null;}}
}
async function slotSave(i){
 if(!S)return;
 if(!hasStore){toast("此处不支持存档格，请改用导出");return;}
 S.t=Date.now();
 try{await window.storage.set(slotKey(i),pack());await loadSlots();renderMain();
  toast("已存入"+SLOTNAME[i]);}catch(e){toast("存不进去");}
}
async function slotLoad(i){
 if(!hasStore)return;
 try{const r=await window.storage.get(slotKey(i));
  if(!r||!r.value){toast("这一格是空的");return;}
  const d=JSON.parse(r.value);
  S=d.s;LOGS=d.l||[];migrate();
  await save(true);render();toast("已回到"+SLOTNAME[i]);}
 catch(e){toast("这一格读不出来");}
}
async function slotWipe(i){
 if(!hasStore)return;
 try{await window.storage.delete(slotKey(i));}catch(e){}
 await loadSlots();renderMain();toast(SLOTNAME[i]+"已抹去");
}
function ago(t){const d=Date.now()-(t||0);const m=Math.floor(d/60000);
 if(m<1)return "刚刚";if(m<60)return m+" 分钟前";
 const h=Math.floor(m/60);if(h<24)return h+" 小时前";
 const y=Math.floor(h/24);return y+" 天前";}
function ask(title,body,okTxt,fn){
 const sh=ov('<h2>'+title+'</h2><div class="seam gold"></div>'+
  '<div class="story"><p class="no">'+body+'</p></div>'+
  '<div class="btns"><button class="btn" id="no">算了</button>'+
  '<button class="btn pri" id="ok">'+okTxt+'</button></div>');
 sh.querySelector("#no").onclick=closeOv;
 sh.querySelector("#ok").onclick=()=>{closeOv();fn();};
}
function slotCards(){
 let h='<div class="grid2">';
 for(let i=0;i<SLOTN;i++){const m=SLOTS[i];
  h+='<div class="card"><div class="t">'+SLOTNAME[i]+'</div>';
  if(m){
   const line=m.name+"　"+(REALM[m.lvl]?REALM[m.lvl].n:"淬体")+
     (m.sect&&SECT[m.sect]?"　"+SECT[m.sect].n:"")+
     (m.end?"　【"+m.end+"】":"　第 "+(m.ch+1)+" 章");
   h+='<div class="m">'+line+'</div>'+
      '<div class="m">银两 '+fmt(m.silver)+'　存于 '+ago(m.t)+'</div>'+
      '<div class="btns" style="margin-top:7px">'+
      '<button class="btn sm pri" data-slotload="'+i+'">读取</button>'+
      '<button class="btn sm" data-slotsave="'+i+'">覆盖</button>'+
      '<button class="btn sm" data-slotwipe="'+i+'">抹去</button></div>';
  } else {
   h+='<div class="m">空</div><div class="d">还没有人在这里落过脚。</div>'+
      '<div class="btns" style="margin-top:7px">'+
      '<button class="btn sm" data-slotsave="'+i+'">存入</button></div>';
  }
  h+='</div>';}
 return h+'</div>';
}
const FORKKEY="tianyi:fork";
let FORKM=null;
async function loadFork(){
 if(!hasStore){FORKM=null;return;}
 try{const r=await window.storage.get(FORKKEY);
  FORKM=(r&&r.value)?slotMeta(JSON.parse(r.value)):null;}catch(e){FORKM=null;}
}
async function forkSnap(){
 if(!S||!hasStore||S.end)return;
 S.t=Date.now();
 try{await window.storage.set(FORKKEY,pack());await loadFork();}catch(e){}
}
async function forkLoad(){
 if(!hasStore)return;
 try{const r=await window.storage.get(FORKKEY);
  if(!r||!r.value){toast("没有分岔存档");return;}
  const d=JSON.parse(r.value);S=d.s;LOGS=d.l||[];migrate();
  await save(true);render();toast("回到了分岔之前");}
 catch(e){toast("读不出来");}
}
function exportSave(){
 const code=btoa(unescape(encodeURIComponent(pack())));
 const sh=ov('<h2>导出存档</h2><div class="seam gold"></div><div class="story"><p class="no">全选复制，收好。</p></div>'+
  '<div class="fld"><textarea id="tx" rows="7" readonly></textarea></div>'+
  '<div class="btns"><button class="btn" id="cp">复制</button><button class="btn pri" id="ok">收</button></div>');
 sh.querySelector("#tx").value=code;
 sh.querySelector("#cp").onclick=()=>{const t=sh.querySelector("#tx");t.select();
  try{navigator.clipboard.writeText(code);toast("已复制");}catch(e){document.execCommand("copy");toast("已复制");}};
 sh.querySelector("#ok").onclick=closeOv;
}
function importSave(){
 const sh=ov('<h2>导入存档</h2><div class="seam gold"></div><div class="story"><p class="no">粘进来，当前进度会被覆盖。</p></div>'+
  '<div class="fld"><textarea id="tx" rows="7" placeholder="存档码"></textarea></div>'+
  '<div class="btns"><button class="btn" id="no">算了</button><button class="btn pri" id="ok">导入</button></div>');
 sh.querySelector("#no").onclick=closeOv;
 sh.querySelector("#ok").onclick=()=>{
  try{const d=JSON.parse(decodeURIComponent(escape(atob(sh.querySelector("#tx").value.trim()))));
   S=d.s;LOGS=d.l||[];migrate();closeOv();save(true);render();toast("导入成功");}
  catch(e){toast("这串东西读不出来");}};
}
function migrate(){
 const t=newGame("无名","gu");
 for(const k in t)if(S[k]===undefined)S[k]=t[k];
 for(const k in ATTR){if(S.at[k]===undefined)S.at[k]=5;if(S.bonus[k]===undefined)S.bonus[k]=0;}
 if(!LOC[S.loc])S.loc="dukou";
 S.spot=spotOf(S.loc,S.spot).id;            // 旧档没有「去处」这一说
 S.been=S.been||{};for(const k of S.locs)S.been[k]=1;
 if(S.trip&&(!S.trip.leg||!LOC[S.trip.leg.to]))S.trip=null;
}
/* ═══════════ 离线 ═══════════ */
function offline(ms){
 const secTotal=ms/1000;
 const full=Math.min(secTotal,12*3600);
 const rest=Math.min(Math.max(0,secTotal-12*3600),60*3600)*0.4;
 const sec=full+rest; if(sec<60)return null;
 const before={exp:S.exp,lvl:S.lvl,silver:S.silver,bag:{...S.bag},arts:{}};
 for(const i in S.arts)before.arts[i]=S.arts[i].lv;
 S.offEv=0;
 const road=[];
 if(S.trip){const T=S.trip;S.trip=null;
  const k=T.scout?(rnd(1)<scoutOdds(T.leg.to)?T.leg.to:null):T.path[T.path.length-1];
  if(k){unlock(S,k);S.loc=k;S.spot=spots(k)[0].id;S.been=S.been||{};S.been[k]=1;
   road.push("那段路你自己走完了。醒过神来，人已经在"+LOC[k].n+"。");}
  else road.push("你在路上绕了半天，又回到了原处。");}
 let left=sec;while(left>0){const d=Math.min(left,600);tick(S,d,true);left-=d;}
 const lines=road.slice();
 const dex=S.exp-before.exp+(S.lvl>before.lvl?expNeed(before.lvl):0);
 if(S.lvl>before.lvl)lines.push("你破了 "+(S.lvl-before.lvl)+" 重境界，如今是「"+REALM[S.lvl].n+"」。");
 lines.push("内力修为增了约 "+fmt(Math.max(0,dex))+"。");
 for(const i in S.arts)if(S.arts[i].lv>(before.arts[i]||0))lines.push("《"+ART[i].n+"》从 "+(before.arts[i]||0)+" 层练到了 "+S.arts[i].lv+" 层。");
 const got=[];for(const k in S.bag){const d=S.bag[k]-(before.bag[k]||0);if(d>0&&ITEM[k])got.push(ITEM[k].n+" ×"+d);}
 if(got.length)lines.push("捡到了："+got.join("，")+"。");
 if(S.silver>before.silver)lines.push("袖中多了 "+fmt(S.silver-before.silver)+" 文。");
 if(S.offEv)lines.push("路上遇着 "+S.offEv+" 桩闲事，都自己了了。");
 return {h:Math.floor(secTotal/3600),m:Math.floor(secTotal%3600/60),lines};
}
function offlineDialog(o){
 const t=o.h>=1?o.h+" 个时辰":o.m+" 刻";
 const h='<h2>你不在的时候</h2><div class="seam gold"></div>'+
  '<div class="story"><p class="no">过了约 '+(o.h>=24?Math.floor(o.h/24)+" 日 "+(o.h%24)+" 时辰":o.h+" 时辰 "+o.m+" 分")+'。功夫没有停。</p>'+
  o.lines.map(l=>'<p class="no">· '+l+'</p>').join("")+'</div>'+
  '<div class="btns"><button class="btn pri" id="ok">接着走</button></div>';
 ov(h).querySelector("#ok").onclick=closeOv;
}

/* ═══════════ 楔子 ═══════════ */
const PRO=[
 "十年前，洛水断流七日。",
 "那七日里，天下但凡内力有成者，无论正邪、无论老幼，都做了同一个梦。",
 "梦里是一条干涸的河床。河床中央坐着一个白发女人，低头缝着什么。她缝得很慢，很稳。线是银的，针脚细密，找不出接头。",
 "第七日夜里，洛水复流。三千零一十七名高手死在自己床上，身上没有一处伤。仵作验尸，只在他们口中，各找到一根一寸长的银线。",
 "江湖管那七天，叫「七日梦」。管那个女人，叫「针娘」。",
 "而你，在那七日之后醒来，忘了十年。",
];
function prologue(){
 const p=$("#pro");p.style.display="flex";
 let h='<div class="inner"><h1 class="ttl">天衣</h1><div class="tsub">无缝的江湖</div>'+
  '<svg class="line" viewBox="0 0 190 12"><path d="M2 6 C 30 -2, 50 14, 78 6 S 130 -2, 188 6"/></svg>'+
  '<div class="txt">';
 PRO.forEach((t,i)=>{h+='<p'+(i===5?' class="no"':'')+' style="animation-delay:'+(2+i*0.85)+'s">'+t+'</p>';});
 h+='</div><button class="btn pri go" id="start" style="animation-delay:'+(2+PRO.length*0.85+0.4)+'s">醒来</button></div>';
 p.innerHTML=h;
 p.querySelector("#start").onclick=originDialog;
 p.onclick=e=>{if(e.target===p){p.querySelectorAll("*").forEach(x=>{x.style.animationDelay="0s";});}};
}
function originDialog(){
 const p=$("#pro");
 let h='<div class="inner"><h1 class="ttl" style="animation:none;opacity:1;font-size:min(9vw,36px)">你是谁</h1>'+
  '<div class="tsub" style="animation:none;opacity:1">在忘掉之前</div><div style="max-width:520px;margin:0 auto">';
 for(const k in ORIGIN){const O=ORIGIN[k];
  h+='<button class="pick" data-k="'+k+'"><b>'+O.n+'</b><p>'+O.d+'</p>'+
   '<p style="color:var(--thread)">'+Object.keys(O.b).map(a=>ATTR[a][0]+"+"+O.b[a]).join("　")+'　银 '+O.silver+' 文</p></button>';}
 h+='</div></div>';
 p.innerHTML=h;
 p.querySelectorAll(".pick").forEach(b=>b.onclick=()=>{
  const k=b.dataset.k;S=newGame("无名",k);
  for(const a in ORIGIN[k].b)S.bonus[a]=(S.bonus[a]||0)+ORIGIN[k].b[a];
  p.style.display="none";$("#app").style.display="flex";
  LOGS=[];addLog("你在洛水渡口的一条船上醒来。","v");
  render();save(true);showScene("c1a");});
}
/* ═══════════ 启动 ═══════════ */
async function boot(){
 if(!(window.storage&&window.storage.get)){
  try{const t="tianyi:probe";localStorage.setItem(t,"1");localStorage.removeItem(t);
   window.storage={get:async k=>({value:localStorage.getItem(k)}),
    set:async(k,v)=>{localStorage.setItem(k,v);},
    delete:async k=>{localStorage.removeItem(k);}};}catch(e){}
 }
 hasStore=!!(window.storage&&window.storage.get);
 await loadSlots();await loadFork();
 const d=hasStore?await load():null;
 if(d&&d.s&&d.s.name){
  S=d.s;LOGS=d.l||[];migrate();
  const gap=Date.now()-(d.t||S.t||Date.now());
  $("#app").style.display="flex";$("#pro").style.display="none";
  render();
  const o=gap>60000?offline(gap):null;
  render();
  if(o)offlineDialog(o);
  else if(S.scene&&SC[S.scene])showScene(S.scene);
 } else prologue();
 let beat=0;
 setInterval(()=>{ if(!S)return;
   const r0=S.lvl,t0=todIdx(),loc0=S.loc,trip0=!!S.trip;
   tick(S,1,false);
   if(S.trip)updTrav();
   if(todIdx()!==t0)todTurn();
   else if((S.lvl!==r0||loc0!==S.loc||trip0!==!!S.trip)&&!$("#ov").innerHTML)renderMain();
   renderChar(); clockTx();
   if((++beat)%2===0)checkStory();
 },1000);
 setInterval(()=>{if(S)save();},20000);
 setInterval(()=>{if(S&&savePending)save(true);},30000);
 document.addEventListener("visibilitychange",()=>{if(document.hidden&&S)save(true);});
 window.addEventListener("beforeunload",()=>{if(S)save(true);});
 const mc=$("#mchar");if(mc)mc.onclick=()=>$("#char").classList.toggle("show");
 let rz=0;
 window.addEventListener("resize",()=>{clearTimeout(rz);
  rz=setTimeout(()=>{if(S&&!$("#ov").innerHTML)renderMain();},220);});
 if(S&&S.au){AU.on=S.au.on!==false;AU.vb=S.au.vb!=null?S.au.vb:AU.vb;AU.vs=S.au.vs!=null?S.au.vs:AU.vs;}
 document.addEventListener("click",e=>{
  const first=!AU.ctx;
  auResume();
  if(first&&S&&AU.on)bgm(bgmFor(S.loc));
  if(e.target.closest(".btn,.tab,.opt,.mapg .on,.pad button"))sfx("tap");
 },true);
}
boot();
